<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1f14">
<title>Mono's · Administración</title>
<style>
:root{--bg:#0f1f14;--panel:#162b1b;--panel2:#1c3823;--line:rgba(243,234,210,.12);--text:#f3ead2;--muted:rgba(243,234,210,.65);--gold:#cbb26a;--gold2:linear-gradient(135deg,#f1e1a6,#cbb26a 50%,#a98b40);--ok:#7dca8e;--bad:#e5897c;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans)}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:700;font-size:.84rem;cursor:pointer}
.btn.gold{background:var(--gold2);color:#1c3823;border-color:var(--gold)}
.btn.ok{color:var(--ok);border-color:rgba(125,202,142,.45)}
.btn.bad{color:var(--bad);border-color:rgba(229,137,124,.45)}
.btn.sm{min-height:34px;padding:0 10px;font-size:.78rem}
.btn:disabled{opacity:.45}
input,select,textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid rgba(243,234,210,.22);border-radius:10px;color:var(--text);outline:none}
input,select{height:46px;padding:0 12px}
textarea{padding:10px 12px;min-height:78px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label.l{display:block;margin:10px 0 5px;font-size:.7rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font:700 .68rem/1.2 var(--sans);border:1px solid;text-transform:uppercase;letter-spacing:.4px}
.p-ocupado{color:var(--gold);border-color:var(--gold)}
.p-completado{color:var(--ok);border-color:var(--ok)}
.p-no_show{color:var(--bad);border-color:var(--bad)}
.p-cancelado{color:var(--muted);border-color:var(--muted)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
#login h1{margin:0 0 4px;font:700 1.8rem var(--serif);color:var(--gold)}
.err{color:var(--bad);margin-top:10px;font-size:.9rem}
#app{display:flex;min-height:100vh}
.side{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .brand{padding:6px 10px 18px;font:700 1.15rem var(--serif);color:var(--gold)}
.side button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:12px;border:none;background:transparent;color:var(--muted);border-radius:10px;cursor:pointer;font-size:.92rem;font-weight:600}
.side button.on{background:rgba(203,178,106,.12);color:var(--gold)}
.side button span{font-size:1.15rem}
.side .sp{flex:1}
.content{flex:1;padding:18px 20px 40px;max-width:1100px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
.topbar h2{margin:0;font:700 1.55rem var(--serif)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:1px}
.kpi b{font:700 1.5rem var(--serif)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:.84rem}
.chip.on{background:var(--gold);color:#1c3823;font-weight:700;border-color:var(--gold)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
.table th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.table tr{cursor:pointer}
.table tr:hover{background:rgba(255,255,255,.03)}
.slot{display:flex;gap:10px;margin-bottom:8px}
.slot .h{width:64px;padding-top:12px;color:var(--muted);font-size:.8rem}
.slot .b{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;background:rgba(255,255,255,.02)}
.slot .b.free{border-style:dashed;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.slot .b.busy{border-color:rgba(203,178,106,.5);background:rgba(203,178,106,.08);cursor:pointer}
.slot .b.done{border-color:rgba(125,202,142,.4);background:rgba(125,202,142,.07)}
.slot .b.ns{border-color:rgba(229,137,124,.45);background:rgba(229,137,124,.08)}
.slot .b.block{background:repeating-linear-gradient(45deg,rgba(0,0,0,.15),rgba(0,0,0,.15) 6px,transparent 6px,transparent 12px);color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;border:none;background:var(--gold2);color:#1c3823;font-size:1.8rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4);cursor:pointer;z-index:40}
.ov{display:none;position:fixed;inset:0;background:rgba(5,12,8,.85);z-index:100;align-items:flex-end;justify-content:center;padding:12px}
.ov.open{display:flex}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:18px}
.modal h3{margin:0 0 8px;font:700 1.35rem var(--serif)}
.x{float:right;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);font-size:1.2rem;cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions .btn{flex:1 1 40%}
.svc{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.svc input{width:18px;height:18px;accent-color:var(--gold)}
.money{font:700 1.3rem var(--serif);color:var(--gold)}
@media(max-width:860px){
  #app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;z-index:30;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;border-right:none;border-bottom:1px solid var(--line)}
  .side .brand,.side .sp{display:none}
  .side button{width:auto;white-space:nowrap;padding:10px 12px;font-size:.8rem}
  .content{padding:14px 12px 90px}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .fab{bottom:18px;right:16px}
}
</style>
</head>
<body>
<div id="login" hidden>
  <div class="box">
    <h1>Mono's Barbería</h1>
    <p class="muted" style="margin:0 0 14px">Panel de administración</p>
    <label class="l">Correo</label>
    <input id="em" type="email" autocomplete="username">
    <label class="l">Contraseña</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="lerr" hidden></p>
    <button class="btn gold" style="width:100%;margin-top:16px" id="bEntrar">Entrar</button>
  </div>
</div>
<div id="cargando" style="padding:50px;text-align:center;color:var(--muted)">Cargando panel…</div>
<div id="app" hidden>
  <aside class="side" id="nav">
    <div class="brand">Mono's Admin</div>
    <button data-t="dash" class="on"><span>📊</span> Dashboard</button>
    <button data-t="agenda"><span>📅</span> Agenda</button>
    <button data-t="citas"><span>📋</span> Citas</button>
    <button data-t="caja"><span>💵</span> Caja</button>
    <button data-t="cli"><span>👥</span> Clientes</button>
    <button data-t="svc"><span>✂️</span> Servicios</button>
    <button data-t="blq"><span>⛔</span> Bloqueos</button>
    <button data-t="rep"><span>📈</span> Reportes</button>
    <button data-t="aju"><span>⚙️</span> Ajustes</button>
    <div class="sp"></div>
    <button onclick="sb.auth.signOut()"><span>⎋</span> Salir</button>
  </aside>
  <main class="content">
    <div class="topbar">
      <h2 id="title">Dashboard</h2>
      <button class="btn sm" id="bRef">Actualizar</button>
    </div>
    <div id="main"></div>
  </main>
  <button class="fab" id="fab" title="Nueva cita">+</button>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
var SUPABASE_URL="https://ldxxflhwpyzldisydhmd.supabase.co";
var SUPABASE_KEY="sb_publishable_zYVUWmP8r6s21WegS23RxQ_G-MOf1TH";
function loadSB(i){
  var u=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'];
  if(i>=u.length){document.getElementById('cargando').textContent='Sin conexión. Recarga.';return}
  var s=document.createElement('script');s.src=u[i];s.onload=boot;s.onerror=function(){loadSB(i+1)};document.head.appendChild(s);
}
</script>
<script>
var sb,S={tab:'dash',vista:'dia',fecha:'',turnos:[],canc:[],bloqueos:[],ns:[],precios:[],map:{},q:'',cq:'',est:'todas'};
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var DIAS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'],MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var EST={ocupado:'Pendiente',completado:'Completado',no_show:'No-show',cancelado:'Cancelado'};

function pd(i){var p=String(i).slice(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addD(i,n){var d=pd(i);d.setDate(d.getDate()+n);return iso(d)}
function lun(i){var d=pd(i);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)}
function fmt(i){var d=pd(i);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]}
function hoy(){return iso(new Date())}
function mins(s){var m=String(s||'').match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/i);if(!m)return 0;var h=+m[1]%12;if(m[3].toUpperCase()==='PM')h+=12;return h*60+ +m[2]}
function t12(m){var h=Math.floor(m/60),mm=m%60,p=h>=12?'PM':'AM';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+' '+p}
function slots(){var o=[];[[540,690],[840,960]].forEach(function(r){for(var m=r[0];m<=r[1];m+=30)o.push(t12(m))});return o}
function money(n){return '$'+(Math.round(Number(n||0)*100)/100)}
function norm(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function uid(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}

async function boot(){
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  S.fecha=hoy();
  var r=await sb.auth.getSession();
  if(r.data&&r.data.session) enter(); else showLogin();
  sb.auth.onAuthStateChange(function(e){if(e==='SIGNED_OUT')showLogin()});
}
function showLogin(){$('#cargando').hidden=true;$('#app').hidden=true;$('#login').hidden=false}
$('#bEntrar').onclick=async function(){
  var e=$('#lerr');e.hidden=true;this.disabled=true;
  var r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  this.disabled=false;
  if(r.error){e.textContent='Correo o contraseña incorrectos.';e.hidden=false;return}
  enter();
};
async function enter(){
  var r=await sb.rpc('soy_admin');
  if(r.error||r.data!==true){
    await sb.auth.signOut();showLogin();
    var e=$('#lerr');e.textContent='Este correo no tiene permiso de administrador.';e.hidden=false;return;
  }
  $('#cargando').hidden=true;$('#login').hidden=true;$('#app').hidden=false;
  await reload();
  setInterval(function(){if(document.visibilityState==='visible'&&!$('#ov').classList.contains('open'))reload(true)},60000);
}

async function reload(quiet){
  try{
    var q=await Promise.all([
      sb.from('turnos').select('*').order('fecha',{ascending:false}),
      sb.from('turnos_cancelados').select('*').order('fecha',{ascending:false}),
      sb.from('bloqueos').select('*').order('fecha',{ascending:false}),
      sb.from('no_shows').select('*'),
      sb.from('precios').select('servicio,precio,orden').order('orden')
    ]);
    if(q[0].error){if(!quiet)alert('Error cargando citas:\n'+q[0].error.message);return}
    S.turnos=q[0].data||[];
    S.canc=q[1].data||[];
    S.bloqueos=q[2].data||[];
    S.ns=q[3].data||[];
    S.precios=q[4].data||[];
    render();
  }catch(err){if(!quiet)alert('Error: '+(err.message||err))}
}

function group(rows,fixed){
  var m={};
  (rows||[]).forEach(function(r){
    var f=String(r.fecha).slice(0,10);
    var k=(fixed?'c|':'')+(r.reserva_id||(f+'|'+r.nombre+'|'+r.telefono));
    var estado=fixed||r.estado||'ocupado';
    if(r.cancelado===true) estado='cancelado';
    if(r.no_show===true && estado!=='completado') estado='no_show';
    var o=m[k]||(m[k]={
      k:k,id:r.reserva_id?String(r.reserva_id):null,rowId:r.id,
      fecha:f,nombre:r.nombre,telefono:r.telefono,servicios:r.servicios,
      total:Number(r.total)||Number(r.precio_esperado)||0,
      estado:estado,turnos:[],
      precio_cobrado:r.precio_cobrado!=null?Number(r.precio_cobrado):null,
      descuento:Number(r.descuento)||0, propina:Number(r.propina)||0,
      precio_esperado:Number(r.precio_esperado)||Number(r.total)||0
    });
    if(r.turno) o.turnos.push(r.turno);
    if(r.precio_cobrado!=null) o.precio_cobrado=Number(r.precio_cobrado);
    if(r.descuento!=null) o.descuento=Number(r.descuento);
    if(r.propina!=null) o.propina=Number(r.propina);
  });
  return Object.keys(m).map(function(k){
    var o=m[k]; o.turnos.sort(function(a,b){return mins(a)-mins(b)}); S.map[k]=o; return o;
  });
}
function allRes(){S.map={};return group(S.turnos).concat(group(S.canc,'cancelado'))}
function hora(r){if(!r.turnos||!r.turnos.length)return '';var a=r.turnos[0],z=r.turnos[r.turnos.length-1];return a+(r.turnos.length>1?' – '+t12(mins(z)+30):'')}
function deuda(tel){return (S.ns||[]).filter(function(n){return n.telefono===tel&&n.estado==='pendiente'}).reduce(function(a,n){return a+Number(n.monto||0)},0)}
function paid(r){return r.precio_cobrado!=null?r.precio_cobrado:(r.estado==='completado'?r.total:0)}
function wa(tel,msg){var n=String(tel||'').replace(/\D/g,'').replace(/^53/,'');window.open('https://wa.me/53'+n+'?text='+encodeURIComponent(msg||''),'_blank')}

$('#nav').onclick=function(e){var b=e.target.closest('button[data-t]');if(!b)return;S.tab=b.dataset.t;render();window.scrollTo(0,0)};
$('#bRef').onclick=function(){reload()};
$('#fab').onclick=function(){nuevaCita()};

function render(){
  document.querySelectorAll('#nav button[data-t]').forEach(function(b){b.classList.toggle('on',b.dataset.t===S.tab)});
  var titles={dash:'Dashboard',agenda:'Agenda',citas:'Citas',caja:'Caja del día',cli:'Clientes',svc:'Servicios',blq:'Bloqueos',rep:'Reportes',aju:'Ajustes'};
  $('#title').textContent=titles[S.tab]||'Panel';
  var fn={dash:vDash,agenda:vAgenda,citas:vCitas,caja:vCaja,cli:vCli,svc:vSvc,blq:vBlq,rep:vRep,aju:vAju}[S.tab];
  $('#main').innerHTML=fn?fn():'';
}

function vDash(){
  var rs=allRes().filter(function(r){return r.estado!=='cancelado'});
  var hstr=hoy();
  var today=rs.filter(function(r){return r.fecha===hstr});
  var weekStart=lun(hstr);
  var week=rs.filter(function(r){return r.fecha>=weekStart&&r.fecha<=addD(weekStart,6)});
  var monthStart=hstr.slice(0,8)+'01';
  var month=rs.filter(function(r){return r.fecha>=monthStart});
  function sumPaid(arr){return arr.reduce(function(a,r){return a+(r.estado==='completado'?paid(r):0)},0)}
  function count(arr,st){return arr.filter(function(r){return r.estado===st}).length}
  var h='<div class="grid4">';
  h+='<div class="kpi"><small>Ingresos hoy</small><b>'+money(sumPaid(today))+'</b></div>';
  h+='<div class="kpi"><small>Ingresos semana</small><b>'+money(sumPaid(week))+'</b></div>';
  h+='<div class="kpi"><small>Ingresos mes</small><b>'+money(sumPaid(month))+'</b></div>';
  h+='<div class="kpi"><small>Citas hoy</small><b>'+today.length+'</b></div></div>';
  h+='<div class="grid4">';
  h+='<div class="kpi"><small>Pendientes hoy</small><b>'+count(today,'ocupado')+'</b></div>';
  h+='<div class="kpi"><small>Completadas hoy</small><b>'+count(today,'completado')+'</b></div>';
  h+='<div class="kpi"><small>No-shows hoy</small><b>'+count(today,'no_show')+'</b></div>';
  var comp=month.filter(function(r){return r.estado==='completado'});
  h+='<div class="kpi"><small>Ticket promedio mes</small><b>'+money(comp.length?sumPaid(month)/comp.length:0)+'</b></div></div>';
  h+='<div class="card"><div class="row" style="margin-bottom:10px"><b>Agenda de hoy · '+fmt(hstr)+'</b><button class="btn sm gold" onclick="nuevaCita()">+ Nueva cita</button></div>';
  if(!today.length) h+='<div class="muted" style="padding:16px 0;text-align:center">No hay citas para hoy</div>';
  else{
    today.sort(function(a,b){return mins(a.turnos[0])-mins(b.turnos[0])});
    h+='<table class="table"><thead><tr><th>Hora</th><th>Cliente</th><th>Servicio</th><th>Estado</th><th>Total</th></tr></thead><tbody>';
    today.forEach(function(r){
      h+='<tr onclick="openRes(\''+r.k+'\')"><td>'+hora(r)+'</td><td>'+esc(r.nombre)+(deuda(r.telefono)?' <span class="pill p-no_show">deuda</span>':'')+'</td><td>'+esc(r.servicios)+'</td><td><span class="pill p-'+r.estado+'">'+EST[r.estado]+'</span></td><td>'+money(r.estado==='completado'?paid(r):r.total)+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  return h+'</div>';
}

function vAgenda(){
  var h='<div class="chips">';
  ['dia','semana','mes'].forEach(function(v){h+='<button class="chip'+(S.vista===v?' on':'')+'" onclick="S.vista=\''+v+'\';render()">'+({dia:'Día',semana:'Semana',mes:'Mes'}[v])+'</button>'});
  h+='</div>';
  if(S.vista==='mes') return h+vMes();
  if(S.vista==='semana') return h+vSem();
  return h+vDia();
}
function vDia(){
  var f=S.fecha,rs=allRes();
  var h='<div class="row" style="margin-bottom:12px"><div><button class="btn sm" onclick="S.fecha=addD(S.fecha,-1);render()">‹</button> <button class="btn sm" onclick="S.fecha=hoy();render()">Hoy</button> <button class="btn sm" onclick="S.fecha=addD(S.fecha,1);render()">›</button></div><b>'+fmt(f)+(f===hoy()?' · hoy':'')+'</b></div>';
  var blq=(S.bloqueos||[]).filter(function(b){return String(b.fecha).slice(0,10)===f});
  var dayBlock=blq.some(function(b){return !b.turno});
  slots().forEach(function(s){
    var r=rs.find(function(x){return x.fecha===f&&x.turnos.indexOf(s)>=0&&x.estado!=='cancelado'});
    var b=blq.find(function(x){return x.turno===s});
    h+='<div class="slot"><div class="h">'+s+'</div>';
    if(dayBlock||b) h+='<div class="b block"><span>Bloqueado</span>'+(b&&b.id?'<button class="btn sm" onclick="delBlock(\''+b.id+'\')">Quitar</button>':'')+'</div>';
    else if(r){
      var cls=r.estado==='completado'?'done':r.estado==='no_show'?'ns':'busy';

function openCobrar(k){

  h+='<div class="row"><span>Precio de lista</span><b>'+money(base)+'</b></div>';
  h+='<label class="l">Descuento ($)</label><input type="number" id="cDesc" value="'+(r.descuento||0)+'" min="0">';
  h+='<label class="l">Propina ($)</label><input type="number" id="cProp" value="'+(r.propina||0)+'" min="0">';

  h+='</div><div class="row" style="margin:12px 0"><span>Total a registrar</span><span class="money" id="cTot">'+money(r.precio_cobrado!=null?r.precio_cobrado:base)+'</span></div>';

async function saveCobro(k){
  var r=S.map[k];if(!r)return;
  var desc=Number($('#cDesc').value)||0;
  var prop=Number($('#cProp').value)||0;
  var monto=Number($('#cMonto').value);
  if(!isFinite(monto)){alert('Monto inválido');return}
  var payload={estado:'completado',precio_cobrado:monto,descuento:desc,propina:prop,no_show:false,cancelado:false};
  var x;
  if(r.id) x=await sb.from('turnos').update(payload).eq('reserva_id',r.id);
  else if(r.rowId) x=await sb.from('turnos').update(payload).eq('id',r.rowId);
  else {alert('No se pudo identificar la cita');return}
  if(x.error){alert('Error: '+x.error.message);return}
  closeM();reload();
}

}
async function saveNueva(){
  var nombre=($('#nNom').value||'').trim(),tel=($('#nTel').value||'').trim(),fecha=$('#nFecha').value,turno=$('#nHora').value;
  if(!nombre||!tel||!fecha||!turno){alert('Completa nombre, teléfono, fecha y hora');return}
  var svcs=[],total=0;
  document.querySelectorAll('#nSvcs input:checked').forEach(function(c){svcs.push(c.dataset.n);total+=Number(c.dataset.p)||0});
  if(!svcs.length){alert('Elige al menos un servicio');return}
  var fila={fecha:fecha,turno:turno,nombre:nombre,telefono:tel,reserva_id:uid(),notificado:false,estado:'ocupado',servicios:svcs.join(', '),total:total,precio_esperado:total,moneda:'CUP',cancelado:false,no_show:false};
  var x=await sb.from('turnos').insert([fila]);
  if(x.error){alert('No se pudo guardar: '+x.error.message);return}
  closeM();S.fecha=fecha;S.tab='agenda';S.vista='dia';reload();
}

function openM(html){$('#modal').innerHTML=html;$('#ov').classList.add('open')}
function closeM(){$('#ov').classList.remove('open')}
$('#ov').onclick=function(e){if(e.target===this)closeM()};
loadSB(0);
</script>
