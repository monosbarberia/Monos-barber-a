const mon = t => String(t).slice(0,7);

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function num(v){ if(v===null||v===undefined||v==="") return 0; const n = Number(String(v).replace(",",".")); return Number.isFinite(n)?n:0; }
function money(v){ const n = Math.round(num(v)); return (n<0?"-$":"$") + Math.abs(n).toLocaleString("en-US"); }
const pct = v => (Number.isFinite(v)?v:0).toFixed(0) + "%";
const norm = s => String(s ?? "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const digits = s => String(s ?? "").replace(/\D/g,"");
const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function parseD(s){ const p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
const todayStr = () => fmt(new Date());
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function niceDate(s){ if(!ISO.test(s)) return s; const p = s.split("-"); return p[2]+"-"+p[1]+"-"+p[0]; }
const shortDate = s => { const p = s.split("-"); return p[2]+"/"+p[1]; };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
function slotMin(t){
  const m = String(t||"").trim().toUpperCase().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/);
  if(!m) return null; let h = Number(m[1])%12; if(m[3]==="PM") h+=12; return h*60+Number(m[2]);
}
function slotPassed(fecha, turno){
  const t = todayStr(); if(fecha<t) return true; if(fecha>t) return false;
  const m = slotMin(turno); if(m===null) return false;
  const n = new Date(); return m <= n.getHours()*60+n.getMinutes();
}
function eachDay(start, end, fn){ const d = parseD(start), e = parseD(end); while(d<=e){ fn(fmt(d), d.getDay()); d.setDate(d.getDate()+1); } }
function workdaysBetween(a, b){ let n = 0; if(a>b) return 0; eachDay(a, b, (d, wd) => { if(wd!==0) n++; }); return n; }
// Lunes de la semana (lunes–sábado; un domingo suelto cae en la semana anterior)
function weekStart(s){ const d = parseD(s), w = d.getDay(); d.setDate(d.getDate() - (w===0?6:w-1)); return fmt(d); }
function monthBounds(month){ const y = +month.slice(0,4), m = +month.slice(5,7); return {first:fmt(new Date(y,m-1,1)), last:fmt(new Date(y,m,0))}; }

function getPeriod(){
  const t = todayStr();
  if(period==="today") return {start:t,end:t,label:"hoy"};
  if(period==="week") return {start:weekStart(t),end:t,label:"esta semana"};
  if(period==="month"){ const d = parseD(t); return {start:fmt(new Date(d.getFullYear(),d.getMonth(),1)),end:t,label:"este mes"}; }
  return {start:START_DATE,end:t,label:"desde el "+niceDate(START_DATE)};
}
// Período COMPLETO (incluye días que aún no llegan): para poder cobrar clientes que vienen antes de su turno
function periodFull(){
  const t = todayStr();
  if(period==="today") return {start:t,end:t};
  if(period==="week"){ const s = weekStart(t); return {start:s,end:addDays(s,6)}; }
  if(period==="month"){ const b = monthBounds(t.slice(0,7)); return {start:b.first,end:b.last}; }
  return {start:START_DATE,end:"2999-12-31"};
}
function inPeriod(r){ const p = getPeriod(); return r.fecha>=p.start && r.fecha<=p.end; }

/* ---------- Reservas (varias filas con igual reserva_id = 1 reserva) ---------- */
function splitServices(text){
  const out = [], seen = new Set();
  String(text||"").replace(/[{}]/g,"").split(",").forEach(x => { const l = x.trim(), k = norm(l); if(k && !seen.has(k)){ seen.add(k); out.push(l); } });
  return out;
}
const hasCharge = row => row.precio_cobrado !== null && row.precio_cobrado !== undefined;
// Productos que se cobran al cliente pero NO entran en la contabilidad de la barbería
const PRODUCTOS_APARTE = ["cafe expresso", "café expresso", "ponquecito casero"];

function isProductoAparte(name){
  const k = norm(name);
  return PRODUCTOS_APARTE.some(p => k === p || k.indexOf(p) >= 0);
}

// Precio desde la tabla precios de Supabase (PRECIOS)
function precioProducto(name){
  // PRECIOS vive en el bloque admin; usamos window si hace falta
  const list = (typeof PRECIOS !== "undefined" && PRECIOS) || window.PRECIOS || [];
  const f = list.find(x => norm(x.n) === norm(name));
  if (f) return num(f.p);
  // Respaldo si aún no cargaron los precios
  const k = norm(name);
  if (k.indexOf("cafe") >= 0) return 40;
  if (k.indexOf("ponque") >= 0) return 100;
  return 0;
}

// Cuánto de esta reserva es de productos aparte
function productsOf(r){
  let s = 0;
  (r.services || []).forEach(n => {
    if(isProductoAparte(n)) s += precioProducto(n);
  });
  // No puede ser más de lo cobrado
  return Math.min(s, num(r.charged));
}

// Dinero que SÍ cuenta para la barbería
const serviceOf = r => Math.max(0, num(r.charged) - productsOf(r));
  
window.buildReservas = function(){
  const map = new Map(); bloqueos = [];
  turnos.forEach(row => {
    if(!row.fecha || !ISO.test(row.fecha) || row.fecha < START_DATE) return;
    if(row.estado && row.estado !== "ocupado") return;
    if(row.cancelado === true) return;
    const phone = digits(row.telefono);
    const financial = hasCharge(row) || row.no_show === true || num(row.total) > 0 || !!row.servicios;
    if(!phone && !financial){ bloqueos.push(row); return; }
    const key = row.reserva_id ? "r:"+row.reserva_id : "i:"+row.id;
    if(!map.has(key)) map.set(key, {key, rows:[], fecha:row.fecha, nombre:row.nombre||"Sin nombre", telefono:row.telefono||"",
      client: phone ? "p:"+phone+":"+norm(row.nombre) : "n:"+norm(row.nombre), services:[], total:0, expected:0, charged:0, tip:0,
      charge:false, noShow:false, noShowPaid:false});
    const r = map.get(key);
    r.rows.push(row);
    r.total = Math.max(r.total, num(row.total));
    r.expected += num(row.precio_esperado);
    r.charged += num(row.precio_cobrado);
    r.tip += num(row.propina);
    if(hasCharge(row)) r.charge = true;
    if(row.no_show === true) r.noShow = true;
    if(row.no_show_cobrado === true) r.noShowPaid = true;
    splitServices(row.servicios).forEach(s => { if(!r.services.some(x => norm(x)===norm(s))) r.services.push(s); });
  });
  reservas = [...map.values()];
  reservas.forEach(r => {
    r.rows.sort((a,b) => (slotMin(a.turno)??0) - (slotMin(b.turno)??0));
    r.turno = r.rows[0].turno;
    r.passed = slotPassed(r.fecha, r.turno);
    // cobrada = realmente atendida. Pasada y sin cobro = pendiente (NO cuenta como servicio)
    if(r.noShow) r.status = "noshow";
    else if(r.charge) r.status = "cobrada";
    else if(r.passed) r.status = "pendiente";
    else r.status = "futura";
    r.products = productsOf(r);
  });
}

function resumen(list){
  const cobradas = list.filter(r => r.status==="cobrada");
  const pend = list.filter(r => r.status==="pendiente");
  const noshows = list.filter(r => r.status==="noshow");
  let revenue = 0, tips = 0, expected = 0, disc = 0, extra = 0, products = 0;

  cobradas.forEach(r => {
    const prod = r.products || productsOf(r);
    const svc  = Math.max(0, r.charged - prod);   // solo barbería
    products += prod;
    revenue  += svc;
    tips     += r.tip;

    // expected / descuentos / extras solo sobre la parte de servicios
    const expSvc = Math.max(0, (r.expected || 0) - prod);
    if(expSvc > 0){
      expected += expSvc;
      const d = svc - expSvc;
      if(d < 0) disc += -d; else extra += d;
    } else {
      expected += svc;
    }
  });

  // Servicios realizados: NO contar café ni ponquecito
  const svc = {}; let svcTotal = 0;
  cobradas.forEach(r => r.services.forEach(s => {
    if(isProductoAparte(s)) return;
    const k = norm(s);
    if(!svc[k]) svc[k] = {label:s, n:0};
    svc[k].n++; svcTotal++;
  }));

  let pendAmount = 0, pendUnknown = 0;
  pend.forEach(r => {
    const a = r.total || r.expected || 0;
    if(a > 0) pendAmount += a; else pendUnknown++;
  });

  return {
    cobradas, pend, noshows,
    revenue, tips, expected, disc, extra,
    products,                    // ← NUEVO: solo para mostrar
    svc, svcTotal, pendAmount, pendUnknown,
    ticket: cobradas.length ? revenue / cobradas.length : 0
  };
}
const gastosPeriodo = () => { const p = getPeriod(); return gastos.filter(g => String(g.fecha)>=p.start && String(g.fecha)<=p.end); };
const sumGastos = l => l.reduce((s,g) => s + num(g.monto), 0);

function buildClients(){
  const p = getPeriod(), map = new Map();
  reservas.forEach(r => {
    let c = map.get(r.client);
    if(!c){ c = {key:r.client,nombre:r.nombre,telefono:r.telefono,visits:0,revenue:0,first:null,last:null,noshows:0,future:false,pVisits:0,pRevenue:0}; map.set(r.client,c); }
    if(r.nombre && r.nombre!=="Sin nombre") c.nombre = r.nombre;
    if(r.telefono) c.telefono = r.telefono;
    if(r.status==="noshow") c.noshows++;
    if(r.status==="futura") c.future = true;
    if(r.status==="cobrada"){   // solo cobradas son visitas
  c.visits++; c.revenue += serviceOf(r);
      if(!c.first || r.fecha<c.first) c.first = r.fecha;
      if(!c.last || r.fecha>c.last) c.last = r.fecha;
      if(r.fecha>=p.start && r.fecha<=p.end){ c.pVisits++; c.pRevenue += serviceOf(r); }
    }
  });
  return [...map.values()];
}

/* ---------- Finanzas: reparto automático de cada ingreso ----------
   REGLA, cada día, con lo cobrado + propinas del día:
   1) El PCT_BARBER % (50%) va a la barbería hasta completar BARBER_BUDGET ($12,000) en el mes.
      Al completarse, desde ese momento ya no se separa nada más para la barbería.
   2) Del resto del día se separa el SAVE_PCT % (10%) para ahorro hasta llegar a SAVE_GOAL ($8,800).
      Si la barbería ya está cubierta, ese "resto" es todo el día. Al llegar a la meta, ya no se separa ahorro.
   3) Lo demás es para ti.
   Cada parte se redondea a múltiplos de ROUND_STEP (billetes). Los repartos diarios suman exactamente los totales del mes. */
function splitDay(ing, acc){
  const capB = BARBER_BUDGET > 0 ? BARBER_BUDGET : 0, capS = SAVE_GOAL > 0 ? SAVE_GOAL : Infinity;
  const reserve = Math.max(0, Math.min(rd(ing * PCT_BARBER / 100), ing, capB - acc.reserve));
  const resto = ing - reserve;
  const ahorro = Math.max(0, Math.min(rd(resto * SAVE_PCT / 100), resto, capS - acc.ahorro));
  return {ing, reserve, ahorro, libre: ing - reserve - ahorro};
}
function monthFin(month){
  if(_fin[month]) return _fin[month];
  // Cobros reales de clientes (sin sintéticos)
  const rs = reservas.filter(r => r.status === "cobrada" && !r.synth && r.fecha.slice(0,7) === month);
  const gReg = sumGastos(gastos.filter(x => String(x.fecha).slice(0,7) === month));
  const perDay = {};
  rs.forEach(r => { perDay[r.fecha] = (perDay[r.fecha] || 0) + serviceOf(r) + r.tip; });
  // Ingresos manuales con "Repartir": se suman al día y se reparten con las mismas reglas
  try {
    const extras = (window.__repartirIngresos && window.__repartirIngresos()) || [];
    extras.forEach(i => {
      const f = String(i.fecha || "").slice(0, 10);
      if (!ISO.test(f) || f.slice(0, 7) !== month || f < START_DATE) return;
      const m = num(i.monto);
      if (m <= 0) return;
      perDay[f] = (perDay[f] || 0) + m;
    });
  } catch (e) {}
  const ing = Object.keys(perDay).reduce((s, d) => s + perDay[d], 0);
  const days = {}, acc = {reserve:0, ahorro:0}; let doneBDay = null, doneSDay = null;
  Object.keys(perDay).sort().forEach(d => {
    const x = splitDay(perDay[d], acc);
    acc.reserve += x.reserve; acc.ahorro += x.ahorro; days[d] = x;
    if (doneBDay === null && BARBER_BUDGET > 0 && acc.reserve >= BARBER_BUDGET - 0.5) doneBDay = d;
    if (doneSDay === null && SAVE_GOAL > 0 && acc.ahorro >= SAVE_GOAL - 0.5) doneSDay = d;
  });
  const reserve = acc.reserve, ahorro = acc.ahorro, resto = ing - reserve;
  const deficit = Math.max(0, gReg - reserve);
  const libre = Math.max(0, resto - ahorro - deficit);
  return _fin[month] = {ing, gReg, reserve, resto, ahorro, deficit, libre, fondo: reserve - gReg, days,
    doneB: doneBDay !== null, doneS: doneSDay !== null, doneBDay, doneSDay};
}
function dayFin(day){
  const f = monthFin(day.slice(0,7));
  return Object.assign({}, f.days[day] || {ing:0, reserve:0, ahorro:0, libre:0});
}
// Fondo acumulado de la barbería (lo reservado menos lo gastado, de todos los meses)
function fundTotal(){
  if(_fin._fund !== undefined) return _fin._fund;
  let y = +START_DATE.slice(0,4), m = +START_DATE.slice(5,7), sum = 0;
  const cur = todayStr().slice(0,7);
  for(let i=0;i<120;i++){
    const k = y+"-"+String(m).padStart(2,"0");
    sum += monthFin(k).fondo;
    if(k >= cur) break;
    m++; if(m>12){ m = 1; y++; }
  }
  return _fin._fund = sum;
}



/* ---------- Compras inteligentes ----------
   Aprende de TUS gastos: agrupa por nombre del producto, calcula cada cuántos días lo compras
   (promedio de tus últimas compras reales), y combina eso con el fondo y el ritmo de la semana. */
function weekPace(){
  const t = todayStr(), cur = weekStart(t), closed = {}; let curRev = 0;
  reservas.filter(r => r.status==="cobrada").forEach(r => {
    const k = weekStart(r.fecha), v = r.charged + r.tip;
    if(k===cur) curRev += v; else if(k<cur) closed[k] = (closed[k]||0) + v;
  });
  const ks = Object.keys(closed).sort().slice(-4);
  const base = ks.length ? ks.reduce((s,k) => s + closed[k], 0) / ks.length : null;
  const elapsed = Math.max(1, workdaysBetween(cur, t));
  const proj = curRev / elapsed * 6;
  const good = (base===null || elapsed<2) ? null : proj >= base*0.9;   // null = todavía no se sabe
  return {base, proj, curRev, good};
}
function purchaseAdvice(){
  const t = todayStr(), wp = weekPace(), groups = {};
  gastos.forEach(g => {
    if(norm(g.categoria)==="otros" || num(g.monto)<=0 || String(g.fecha)<START_DATE) return;
    const name = String(g.descripcion||"").trim() || String(g.categoria||"Producto"), k = norm(name);
    if(!groups[k]) groups[k] = {name, buys:[]};
    groups[k].buys.push({fecha:String(g.fecha), monto:num(g.monto)});
  });
  let fondo = fundTotal();
  const items = Object.values(groups).map(gr => {
    gr.buys.sort((a,b) => a.fecha.localeCompare(b.fecha));
    const last = gr.buys[gr.buys.length-1], recent = gr.buys.slice(-3);
    const cost = recent.reduce((s,b) => s + b.monto, 0) / recent.length;
    const gaps = []; for(let i=1;i<gr.buys.length;i++){ const d = daysBetween(gr.buys[i-1].fecha, gr.buys[i].fecha); if(d>0) gaps.push(d); }
    const cycle = gaps.length ? Math.round(gaps.slice(-3).reduce((s,x) => s + x, 0) / Math.min(3,gaps.length)) : null;
    return {name:gr.name, last, cost, cycle, left: cycle===null ? null : cycle - daysBetween(last.fecha, t)};
  });
  items.sort((a,b) => (a.left===null?9999:a.left) - (b.left===null?9999:b.left));
  return items.map(it => {
    const a = {name:it.name, level:"ok", short:"", detail:""};
    if(it.cycle===null){
      a.level = "learn"; a.short = "Aprendiendo";
      a.detail = "Solo hay 1 compra anotada ("+money(it.cost)+" el "+niceDate(it.last.fecha)+"). Con la próxima calculo cada cuánto se te acaba.";
      return a;
    }
    const lead = Math.max(3, Math.round(it.cycle*0.2)), early = lead + 7, left = it.left, can = fondo >= it.cost;
    const info = "Lo compras cada ~"+it.cycle+" días · "+money(it.cost)+". ";
    // Si hay stock en inventario, úsalo para afinar el consejo
    const inv = (window.inventario || []).find(x => norm(x.nombre) === norm(it.name));
    if (inv) {
      const stock = Number(inv.stock_actual);
      const min = Number(inv.stock_minimo);
      if (stock <= min) {
        a.level = can ? "buy" : "urgent";
        a.short = stock <= 0 ? "Sin stock" : "Stock bajo";
        a.detail = info + "En inventario te quedan " + stock + " (mínimo " + min + "). " +
          (can ? "El fondo alcanza: conviene reponer." : "El fondo aún no alcanza del todo.");
        if (can) fondo -= it.cost;
        return a;
      }
      // Si hay stock de sobra, no urge aunque el ciclo diga que "ya toca"
      if (stock > min + 1 && left !== null && left <= lead) {
        a.level = "ok";
        a.short = "Hay stock";
        a.detail = info + "Te quedan " + stock + " en inventario. Aunque el ciclo diga que ya toca, aún no urge.";
        return a;
      }
    }
    if(left > early){
      a.short = "Aún no toca"; a.detail = info + "Te dura unos "+left+" días (≈ "+shortDate(addDays(t,left))+").";
    }else if(left <= lead){
      if(can){
        a.level = "buy"; a.short = left<=0 ? "Compra ya" : "Buen momento";
        a.detail = info + (left<=0 ? "Ya te tocaba. " : "Te quedan ~"+left+" días. ") + "El fondo de la barbería lo cubre: cómpralo de ahí, no de tu retiro.";
        fondo -= it.cost;
      }else if(left <= 0){
        a.level = "urgent"; a.short = "Falta fondo";
        a.detail = info + "Ya te tocaba y el fondo tiene "+money(Math.max(0,fondo))+" de "+money(it.cost)+". Cómpralo con los próximos ingresos del día.";
      }else{
        a.level = "wait"; a.short = "Espera";
        a.detail = info + "Te quedan ~"+left+" días y el fondo aún no alcanza (faltan "+money(it.cost-Math.max(0,fondo))+"). Se va llenando con cada cobro.";
      }
    }else{ // ventana de adelanto: hay margen para elegir una buena semana
      if(wp.good===true && can){
        a.level = "buy"; a.short = "Adelanta";
        a.detail = info + "Esta semana va bien y el fondo alcanza. Comprarlo ahora evita que te agarre una semana floja (te quedan ~"+left+" días).";
        fondo -= it.cost;
      }else if(wp.good===false){
        a.level = "wait"; a.short = "Espera";
        a.detail = info + "Esta semana va floja y aún te dura ~"+left+" días: mejor espera una semana mejor.";
      }else{
        a.short = "Ya viene"; a.detail = info + "Te quedan ~"+left+" días. Te aviso cuando sea buen momento.";
      }
    }
    return a;
  });
}

function occupancy(list, p){
  let avail = 0;
  eachDay(p.start, p.end, (d, wd) => { if(wd===0) return; avail += SLOTS.filter(t => slotPassed(d,t)).length; });
  const blocked = bloqueos.filter(b => b.fecha>=p.start && b.fecha<=p.end && slotPassed(b.fecha,b.turno)).length;
  avail = Math.max(0, avail - blocked);
  let used = 0;
  list.forEach(r => { if(r.status==="cobrada") r.rows.forEach(x => { if(slotPassed(x.fecha,x.turno)) used++; }); });
  return {avail, used, pct: avail ? Math.min(100, used/avail*100) : 0};
}

/* ---------- Datos ---------- */
async function fetchAll(table){
  const size = 1000; let from = 0, all = [];
  while(true){
    let q = sb.from(table).select("*");
    if(table==="turnos") q = q.gte("fecha", START_DATE).lte("fecha","2999-12-31");
    q = q.order("id",{ascending:true}).range(from, from+size-1);
    const {data, error} = await q; if(error) throw error;
    all = all.concat(data||[]); if(!data || data.length<size) break; from += size;
  }
  return all;
}
async function loadData(){
  $("globalMsg").innerHTML = "";
  try{
    const res = await Promise.all([
  fetchAll("turnos"), 
  fetchAll("gastos"), 
  fetchAll("metas"),
  sb.from("inventario").select("*").order("nombre")
]);
turnos = res[0]; 
gastos = res[1].filter(g => String(g.fecha) >= START_DATE); 
metas = res[2];
window.inventario = (res[3].data || []);
lastLoad = Date.now();
    if(!turnos.length) $("globalMsg").innerHTML = '<div class="msg err">No hay turnos desde '+niceDate(START_DATE)+'. Si debería haber, revisa que tu usuario esté en la tabla admins.</div>';

}

  $("saveGoal").disabled = true; let error;
  const found = metas.find(m => String(m.mes).slice(0,10)===mes);

function learn(){
  const t = todayStr(), month = mon(t), C = cobr(), byDay = {};

  // Confianza

  $("pg-plan").innerHTML = h;

/* ---------- Simulador (aparte, no toca tus datos reales) ---------- */
const SIM = {N:null, T:null, C:null, X:50, L:10, touched:{}};
function simDefaults(m){
  const from = addDays(m.t,-28), last = m.C.filter(r => r.fecha > from), s0 = from < START_DATE ? START_DATE : from;
  const wdays = Math.max(1, workdaysBetween(s0, m.t));
  return {N:last.length ? Math.round(last.length/wdays*26) : null, T:last.length ? Math.round(last.reduce((s,r) => s + r.charged, 0)/last.length) : null, C:Math.round(m.costVar)};
}
const simField = (k, label, val) => '<div class="field"><label>'+label+'</label><input type="number" inputmode="decimal" data-k="'+k+'" value="'+(val === null || val === undefined ? "" : val)+'"></div>';
function renderSim(X){
  const d = simDefaults(X.m);
  ["N","T","C"].forEach(k => { if(!SIM.touched[k]) SIM[k] = d[k]; });
  let h = '<h1>Simula</h1><p class="lead">Prueba cambiar tus precios y mira cómo te iría.</p>';
  h += '<div class="msg" style="margin:0 0 12px;background:rgba(203,178,106,.12);border:1px solid var(--line);color:var(--gold-soft)">Esto es solo una simulación: nada de lo que escribas aquí se guarda ni cambia tus cifras reales.</div>';
  h += '<div class="block">' + simField("N","Clientes que atiendes al mes",SIM.N) + simField("T","Cuánto cobras en promedio por cliente",SIM.T) + simField("C","Lo que gastas en productos por cliente",SIM.C) +
    simField("X","Cuánto subirías el precio (por cliente)",SIM.X) + simField("L","Clientes que crees que podrías perder (%)",SIM.L) +
    '<div class="note">Los 3 primeros los calculé con tus últimos 28 días. Cámbialos si quieres probar otra situación.</div></div>';
  h += '<div class="block"><div class="blockTitle">Resultado</div><div id="simOut"></div><div class="chartBox" style="margin-top:12px"><canvas id="chSim"></canvas></div>' +
    '<div class="note">La línea verde muestra cuánto ganas de más (o de menos) al mes según el % de clientes que pierdas. Donde cruza la línea roja (cero) está tu punto seguro.</div></div>';
  $("pg-sim").innerHTML = h;
  simOut();
}
function simOut(){
  const box = $("simOut"); if(!box) return;
  const N = SIM.N, T = SIM.T, c = SIM.C || 0, X = SIM.X || 0, L = (SIM.L || 0)/100;
  if(!(N > 0) || !(T > 0)){ box.innerHTML = empty("Escribe cuántos clientes atiendes al mes y cuánto cobras en promedio."); if(charts.chSim){ charts.chSim.destroy(); delete charts.chSim; } return; }
  const base = N*(T - c), prof = l => N*(1 - l)*(T + X - c), extra = l => prof(l) - base;
  const brk = (X > 0 && (T + X - c) > 0) ? X/(T + X - c)*100 : null;
  let h = row("Hoy ganas al mes", "Clientes × (lo que cobras − productos)", money(base), "ok") +
    row("Subes "+money(X)+" y no pierdes a nadie", "Lo mismo, con el precio nuevo", sgn(extra(0)), extra(0) >= 0 ? "ok" : "bad") +
    row("Subes "+money(X)+" y pierdes "+(SIM.L || 0)+"% de clientes", "Con menos clientes pero más caros", sgn(extra(L)), extra(L) >= 0 ? "ok" : "bad");
  if(brk !== null) h += row("Tu punto seguro", "Puedes perder hasta este % de clientes y ganar igual que hoy", brk.toFixed(0)+"%", "warn");
  box.innerHTML = h;
  const xs = [], ys = []; for(let l = 0; l <= 20; l += 2){ xs.push(l+"%"); ys.push(Math.round(extra(l/100))); }
  multiLine("chSim", xs, [{label:"Ganancia de más al mes", data:ys, color:C_OK, fill:true}, {label:"Igual que hoy", data:xs.map(() => 0), color:C_BAD, dash:[2,4], r:0, tension:0}], {money:true, beginZero:false});
}

/* ---------- Avisos a clientes (en la pantalla Clientes) ---------- */
function fill(tpl, c){

/* =====================================================================

   ===================================================================== */
const main = document.querySelector("main");
["plan","sim"].forEach(n => { const s = document.createElement("section"); s.id = "pg-"+n; s.className = "hidden"; main.appendChild(s); });

<script>

let DBERR = "";
const pend = (k, on) => { try{ if(on === undefined) return localStorage.getItem("monos_pend_"+k) === "1"; if(on) localStorage.setItem("monos_pend_"+k,"1"); else localStorage.removeItem("monos_pend_"+k); }catch(e){} return false; };

async function kvSet(k, v){

    if(r.error) throw r.error;

      r = await sb.from("ajustes").insert({clave:k, valor:v}).select("clave");
      if(r.error) throw r.error;

}

if(!p.error){

  }catch(e){}

/* ---------- Ventanas y avisos (en vez de las ventanitas de texto) ---------- */
function toast(t, ms){
  let el = $("xToast"); if(!el){ el = document.createElement("div"); el.id = "xToast"; document.body.appendChild(el); }
  el.textContent = t; el.className = "show"; clearTimeout(toast._t); toast._t = setTimeout(() => { el.className = ""; }, ms || 3500);
}
function sheet(title, html, okLabel, getVals, onOpen){
  return new Promise(resolve => {
    const m = document.createElement("div"); m.className = "modal"; m.style.zIndex = 120;
    m.innerHTML = '<div class="sheet"><h2>'+title+'</h2>'+html+'<div class="xmsg"></div>'+
      (okLabel ? '<button class="btn xok">'+okLabel+'</button>' : '')+'<button class="btnGhost xno">'+(okLabel ? 'Cancelar' : 'Cerrar')+'</button></div>';
    document.body.appendChild(m);
    const close = v => { m.remove(); resolve(v); };
    m.querySelector(".xno").onclick = () => close(null);
    m.addEventListener("click", e => { if(e.target === m) close(null); });
    const ok = m.querySelector(".xok");
    if(ok) ok.onclick = () => { const v = getVals ? getVals(m) : true; if(v === false) return; close(v); };
    m.err = t => { m.querySelector(".xmsg").innerHTML = '<div class="msg err">'+esc(t)+'</div>'; };
    if(onOpen) onOpen(m);
  });
}
async function ask(title, text, okLabel){ return !!(await sheet(esc(title), '<p class="lead" style="margin-bottom:6px">'+esc(text)+'</p>', okLabel || "Aceptar")); }

 const prods = (r.services || []).filter(isProductoAparte);

    'Se cobran al cliente, pero en Resumen solo se visualizan y no entran en el reparto de la barbería.</div>';
} 
  html += '<div class="subTitle" style="margin-top:0">Servicios</div>';
  html += names.length ? names.map((n,i) => '<label class="xsv"><input type="checkbox" class="xsc" data-i="'+i+'"'+(isSel(n)?" checked":"")+'><span>'+esc(n)+'</span><input type="number" inputmode="decimal" class="xpr xsp" data-i="'+i+'" value="'+(priceOf(n)||"")+'"></label>').join("")
    : '<div class="note">Aún no hay lista de precios (Negocio ▾ → Precios). Escribe el precio abajo.</div>';
  html += fld("xBase","Precio normal","number", r.total || r.expected || "") + fld("xDesc","Descuento","number","") + fld("xTip","Propina","number", r.tip || "");
  html += '<div class="row" style="border:0"><div class="rowTop"><div class="rowTitle">Total a cobrar</div><div class="rowVal ok" id="xTot" style="font-size:22px">$0</div></div></div>';
  const v = await sheet("Cobrar a "+esc(r.nombre), html, "Guardar cobro", m => {

    const nsOn = m.querySelector("#xNsOn") && m.querySelector("#xNsOn").checked, nsAmt = nsOn ? num(m.querySelector("#xNsAmt").value) : 0;

  }, m => {
    let touched = false; const q = s => m.querySelector(s);
    const calc = () => { const t = Math.max(0, num(q("#xBase").value) - num(q("#xDesc").value)) + (q("#xNsOn") && q("#xNsOn").checked ? num(q("#xNsAmt").value) : 0); q("#xTot").textContent = money(t); };
    const sum = () => { let s = 0; m.querySelectorAll(".xsc").forEach(c => { if(c.checked){ const p = m.querySelector('.xsp[data-i="'+c.dataset.i+'"]'); s += num(p && p.value); } }); return s; };
    m.addEventListener("input", e => {
      if(e.target.id === "xBase") touched = true;

  let ok = await updRows([ids[0]], Object.assign({}, all, first));
  if(ok && ids.length > 1) ok = await updRows(ids.slice(1), Object.assign({}, all, {precio_cobrado:0, propina:0}));

/* ---------- Cierre del día ---------- */
function cierreTexto(day){
  const list = reservas.filter(r => r.fecha === day);
  const cob = list.filter(r => r.status === "cobrada"), ns = list.filter(r => r.status === "noshow"), pend = list.filter(r => r.status === "pendiente" || r.status === "futura");
  const rev = cob.reduce((s,r) => s + r.charged, 0), tips = cob.reduce((s,r) => s + r.tip, 0), svc = cob.reduce((s,r) => s + r.services.length, 0);
  const pendAmt = pend.reduce((s,r) => s + owedOf(r), 0);
  const d = dayFin(day), mth = day.slice(0,7), f = monthFin(mth), L = [], hitos = [];
  L.push("💈 *Cierre del día · "+DAYS[parseD(day).getDay()]+" "+niceDate(day)+"*", "");
  L.push("👥 Atendidos: *"+cob.length+"*"+(svc ? " ("+svc+" servicios)" : ""));
  L.push("💵 Cobrado: *"+money(rev)+"*");
  L.push("🙌 Propinas: *"+money(tips)+"*");
  L.push("🔴 Descuentos: *"+money(resumen(cob).disc)+"*");
  L.push("➕ Total del día: *"+money(rev+tips)+"*");
  if(cob.length) L.push("🎟️ Ticket promedio: "+money(rev/cob.length));
  if(ns.length) L.push("🚫 No-shows: "+ns.length+" ("+ns.slice(0,3).map(r => r.nombre).join(", ")+")");
  if(pend.length) L.push("⏳ Sin cobrar: "+pend.length+(pendAmt ? " (≈ "+money(pendAmt)+")" : ""));
  L.push("", "*Reparto de hoy*", "🏠 Barbería: "+money(d.reserve), "🔵 Ahorro: "+money(d.ahorro), "🟢 Para ti: *"+money(d.libre)+"*");
  L.push("", "*Barbería y ahorro del mes*");
  const prevIng = Math.max(0, f.ing - d.ing), prevRes = f.reserve - d.reserve, covered = f.reserve >= BARBER_BUDGET - 0.5;
  if(covered) L.push("✅ Gastos de la barbería CUBIERTOS ("+money(BARBER_BUDGET)+")");
  else L.push("⏳ Gastos de la barbería: "+money(f.reserve)+" de "+money(BARBER_BUDGET)+" · faltan "+money(BARBER_BUDGET - f.reserve));
  if(covered && prevRes < BARBER_BUDGET - 0.5 && d.ing > 0) hitos.push("🎉 ¡Hoy se cubrieron los gastos de la barbería del mes!");
  const am = SAVE_GOAL, prevAh = f.ahorro - d.ahorro;
  L.push("🔵 Ahorro del mes: "+money(f.ahorro)+(am > 0 ? " de "+money(am)+(f.ahorro >= am ? " ✅ ¡meta de ahorro lograda!" : " · faltan "+money(am - f.ahorro)) : ""));
  if(am > 0 && f.ahorro >= am && prevAh < am && d.ing > 0) hitos.push("🎉 ¡Hoy llegaste a la meta de ahorro del mes!");
  L.push("🏦 Fondo acumulado de la barbería: "+money(fundTotal()));
  const g = metas.find(x => String(x.mes).slice(0,7) === mth);
  if(g){
    const gr = num(g.objetivo_ingresos), gp = num(g.objetivo_ganancia), b = monthBounds(mth), s0 = b.first < START_DATE ? START_DATE : b.first;
    const daily = gr > 0 ? gr / Math.max(1, workdaysBetween(s0, b.last)) : 0, profit = f.ing - f.gReg;
    L.push("", "*Metas*");
    if(daily > 0) L.push("📅 Meta del día: "+money(d.ing)+" de "+money(daily)+(d.ing >= daily ? " ✅ ¡lograda!" : " · faltaron "+money(daily - d.ing)));
    if(gr > 0){ L.push("🎯 Cobrado del mes: "+money(f.ing)+" de "+money(gr)+" ("+pct(f.ing/gr*100)+")"+(f.ing >= gr ? " ✅ ¡meta lograda!" : " · faltan "+money(gr - f.ing)));
      if(f.ing >= gr && prevIng < gr && d.ing > 0) hitos.push("🏆 ¡Hoy se logró la meta de dinero cobrado del mes!"); }
    if(gp > 0) L.push("💎 Ganancia neta del mes: "+money(profit)+" de "+money(gp)+(profit >= gp ? " ✅ ¡meta lograda!" : " · faltan "+money(gp - profit)));
  }
  if(hitos.length){ L.push(""); hitos.forEach(h => L.push(h)); }
  return L.join("\n");
}

async function guardarPrecios(){
  const list = PRECIOS.filter(x => String(x.n).trim()).map((x,i) => ({servicio:String(x.n).trim(), precio:Math.max(0, Math.round(num(x.p))), orden:i+1}));
  if(!list.length){ alert("Deja al menos un servicio en la lista."); return false; }
  const seen = new Set();
  for(const r of list){ const k = norm(r.servicio); if(seen.has(k)){ alert("Hay un servicio repetido: "+r.servicio); return false; } seen.add(k); }
  const up = await sb.from("precios").upsert(list, {onConflict:"servicio"});
  if(up.error){ alert("No se pudieron guardar los precios: "+up.error.message); return false; }
  const old = await sb.from("precios").select("servicio");
  const keep = new Set(list.map(r => r.servicio));
  const gone = (old.data || []).map(o => o.servicio).filter(s => !keep.has(s));
  if(gone.length){
    const d = await sb.from("precios").delete().in("servicio", gone).select("servicio");
    if(d.error) alert("Se guardaron los precios, pero no se pudieron quitar los servicios eliminados: "+d.error.message);
  }
  PRECIOS = list.map(r => ({n:r.servicio, p:r.precio})); window.PRECIOS = PRECIOS; DIRTY["pg-precios"] = false;
  return true;
}
async function aplicarPreciosSql(){

  if(!(await guardarPrecios())) return;
  const r = await sb.rpc("aplicar_precios");

  if(r.error){ alert("Los precios se guardaron, pero no se pudieron aplicar a las reservas futuras: "+r.error.message+"\n\nFalta crear la función aplicar_precios en Supabase."); return; }
  toast("Listo: "+r.data+" reserva(s) futura(s) actualizadas", 6000);
  await loadData();
}

async function cambiarStock(id, delta) {
  const item = (window.inventario || []).find(x => Number(x.id) === id);
  if (!item) return;

  const nuevo = Math.max(0, Number(item.stock_actual) + delta);
  const { error } = await sb.from("inventario")
    .update({ stock_actual: nuevo })
    .eq("id", id);

  if (error) {
    alert("No se pudo actualizar: " + error.message);
    return;
  }

  item.stock_actual = nuevo;
  if (typeof renderInventarioPg === "function") renderInventarioPg();
  toast(delta > 0 ? ("Stock +" + delta) : ("Stock " + delta));
}

  async function comprarProducto(item) {
  if (!item) return;

  const html =
    '<p class="lead">Vas a registrar la compra de «' + esc(item.nombre) + '» y sumarla al stock.</p>' +
    '<div class="field"><label>Fecha</label><input id="cpFecha" type="date" value="' + todayStr() + '"></div>' +
    '<div class="field"><label>¿Cuántas unidades compraste?</label><input id="cpQty" type="number" inputmode="decimal" value="1" min="1"></div>' +
    '<div class="field"><label>Monto total pagado</label><input id="cpMonto" type="number" inputmode="decimal" placeholder="Ej. 350"></div>' +
    '<div class="field"><label>¿De dónde sale el dinero?</label><select id="cpBolsa">' +
      '<option value="barberia" selected>Barbería</option>' +
      '<option value="ahorro">Ahorro</option>' +
      '<option value="mio">Para ti</option>' +
    '</select></div>';

  const v = await sheet(
    "Registrar compra",
    html,
    "Guardar compra",
    m => {
      const fecha = m.querySelector("#cpFecha").value;
      const qty = Number(m.querySelector("#cpQty").value) || 0;
      const monto = num(m.querySelector("#cpMonto").value);
      const bolsa = m.querySelector("#cpBolsa").value;
      if (!fecha) { m.err("Elige la fecha."); return false; }
      if (qty <= 0) { m.err("Pon al menos 1 unidad."); return false; }
      if (monto <= 0) { m.err("Escribe el monto que pagaste."); return false; }
      return { fecha, qty, monto, bolsa };
    }
  );
  if (!v) return;

  // 1) Guardar el gasto
  const { data, error } = await sb.from("gastos").insert({
    fecha: v.fecha,
    categoria: "productos",
    descripcion: item.nombre,
    monto: v.monto
  }).select("id");

  if (error) {
    alert("No se pudo guardar el gasto: " + error.message);
    return;
  }

  // 2) Si eligió otra bolsa que no sea barbería, intentar marcarlo (si existe el sistema de carteras)
  const gastoId = data && data[0] && data[0].id;
  if (gastoId && v.bolsa !== "barberia") {
    try {
      // Se guarda en ajustes/cartera si está disponible; si no, el gasto queda en barbería por defecto
      const cartRaw = localStorage.getItem("monos_cartera");
      if (cartRaw) {
        const cart = JSON.parse(cartRaw);
        cart.bolsaG = cart.bolsaG || {};
        cart.bolsaG[gastoId] = v.bolsa;
        localStorage.setItem("monos_cartera", JSON.stringify(cart));
        await sb.from("ajustes").upsert({ clave: "cartera", valor: cart }, { onConflict: "clave" });
      }
    } catch (e) { console.error(e); }
  }

  // 3) Sumar al stock
  await window.cambiarStock(Number(item.id), v.qty);

  toast("Compra registrada: " + money(v.monto) + " · stock +" + v.qty);
  await loadData();
  if (typeof renderInventarioPg === "function") renderInventarioPg();
}

        '<button class="act" data-inv-plus="'+item.id+'">Compré (+1)</button>' +
        '<button class="act" data-inv-edit="'+item.id+'">Editar</button>' +
        '<button class="act red" data-inv-del="'+item.id+'">Borrar</button>'
      );

  }

  h += '<button class="btn" style="margin-top:14px" id="btnAddProducto">+ Añadir producto</button>';

  const btnAdd = document.getElementById("btnAddProducto");

function blockedDays(){
  const map = {}, seen = new Set(), t = todayStr();
  BLK.concat(bloqueos.filter(b => b.fecha >= t)).forEach(b => {
    if(seen.has(b.id)) return; seen.add(b.id);
    const d = map[b.fecha] = map[b.fecha] || {fecha:b.fecha, ids:[], slots:[]};
    d.ids.push(b.id); d.slots.push({id:b.id, turno:b.turno});
  });
  Object.keys(map).forEach(f => map[f].slots.sort((a,b) => (slotMin(a.turno)||0) - (slotMin(b.turno)||0)));
  return Object.keys(map).sort().map(f => map[f]);
}

async function bloquearDias(){
  const from = $("blkFrom").value, to = $("blkTo").value, t = todayStr();
  if(!from || !to || from > to){ toast("Revisa las fechas: «Hasta» no puede ser antes que «Desde»."); return; }
  if(from < t){ toast("Elige fechas desde hoy en adelante."); return; }
  const rows = []; let dias = 0;
  eachDay(from, to, (d, wd) => { if(wd === 0) return; dias++; SLOTS.forEach(s => rows.push({fecha:d, turno:s, estado:"ocupado", nombre:"Bloqueado", notificado:true})); });
  if(!dias){ toast("Esas fechas son solo domingos."); return; }
  const booked = reservas.filter(r => r.fecha >= from && r.fecha <= to).length;
  if(!(await ask("Bloquear días", "Se cerrarán los turnos libres de "+dias+" día(s), del "+niceDate(from)+" al "+niceDate(to)+"."+(booked ? " Hay "+booked+" reserva(s) de clientes en esas fechas; no se tocan." : ""), "Bloquear"))) return;
  for(let i = 0; i < rows.length; i += 200){
    const {error} = await sb.from("turnos").upsert(rows.slice(i, i+200), {onConflict:"fecha,turno", ignoreDuplicates:true});
    if(error){ alert("No se pudo bloquear: "+error.message+"\n\nSi dice 'policy', corre el SQL que te dejé en el chat."); return; }
  }
  DIRTY["pg-bloqueos"] = false; toast("Días bloqueados"); await loadData();
}

async function bloquearHoras(){
  const day = $("blkDay").value, t = todayStr();
  const sel = Array.prototype.map.call(document.querySelectorAll("#pg-bloqueos .blkS:checked"), x => x.value);
  if(!day || day < t){ toast("Elige un día desde hoy en adelante."); return; }
  if(parseD(day).getDay() === 0){ toast("Los domingos no hay turnos."); return; }
  if(!sel.length){ toast("Marca al menos una hora."); return; }
  const ocupadas = sel.filter(s => reservas.some(r => r.fecha === day && r.rows.some(x => x.turno === s)));
  const libres = sel.filter(s => ocupadas.indexOf(s) < 0);
  if(!libres.length){ toast("Esas horas ya tienen clientes reservados."); return; }
  const msg = "Se cerrarán "+libres.length+" hora(s) del "+niceDate(day)+": "+libres.join(", ")+"."+
    (ocupadas.length ? " No se tocan las que ya tienen cliente: "+ocupadas.join(", ")+"." : "");
  if(!(await ask("Bloquear horas", msg, "Bloquear"))) return;
  const rows = libres.map(s => ({fecha:day, turno:s, estado:"ocupado", nombre:"Bloqueado", notificado:true}));
  const {error} = await sb.from("turnos").upsert(rows, {onConflict:"fecha,turno", ignoreDuplicates:true});
  if(error){ alert("No se pudo bloquear: "+error.message+"\n\nSi dice 'policy', corre el SQL que te dejé en el chat."); return; }
  DIRTY["pg-bloqueos"] = false; toast("Horas bloqueadas"); await loadData();
}

async function fetchFull(table){
  let from = 0, all = [];
  while(true){
    const {data, error} = await sb.from(table).select("*").order("id",{ascending:true}).range(from, from+999);
    if(error) throw error; all = all.concat(data || []); if(!data || data.length < 1000) break; from += 1000;
  }
  return all;

  Object.keys(o).forEach(k=>{o[k].q=o[k].c+o[k].x-o[k].g;});
  if(o.barberia.q<0){o.mio.q+=o.barberia.q;o.barberia.q=0;}
  return o;
}
function openBal(){
  const o={barberia:0,ahorro:0,mio:0};
  let y=+START_DATE.slice(0,4),m=+START_DATE.slice(5,7);const cur=todayStr().slice(0,7);
  for(let i=0;i<120;i++){
    const k=y+"-"+String(m).padStart(2,"0");if(k>=cur)break;
    const f=monthFin(k);
    o.barberia+=f.reserve-f.gReg;o.ahorro+=f.ahorro;
    m++;if(m>12){m=1;y++;}
  }
  CART.ingresos.forEach(i=>{if(mon(String(i.fecha))<cur&&o[i.bolsa]!==undefined)o[i.bolsa]+=num(i.monto);});
  outG.forEach(g=>{const b=bolsaOfG(g.id);if(mon(String(g.fecha))<cur&&o[b]!==undefined)o[b]-=num(g.monto);});
  o.barberia=Math.max(0,o.barberia);o.ahorro=Math.max(0,o.ahorro);
  return o;
}
window.__carry=openBal;
window.barStack=function(t,carry,cur,goal,cls,bcls){
  const tot=goal+carry,done=carry+cur,falta=tot-done;
  const pc=tot>0?Math.min(100,done/tot*100):0;
  const wc=tot>0?Math.min(100,carry/tot*100):0;
  const wm=Math.max(0,Math.min(100-wc,tot>0?cur/tot*100:0));
  const col=bcls==="b"?"var(--save)":"var(--bad)";
  return '<div class="row"><div class="rowTop"><div><div class="rowTitle">'+t+'</div>'+
    '<div class="rowSub">'+money(done)+' de '+money(tot)+(falta>0.5?' · faltan '+money(falta):' · ¡cubierto!')+'</div>'+
    '<div class="rowSub"><span style="color:var(--warn)">■</span> Sobrante anterior '+money(carry)+' · <span style="color:'+col+'">■</span> Este mes '+money(cur)+'</div></div>'+
    '<div class="rowVal '+cls+'">'+pct(pc)+'</div></div>'+
    '<div class="bar" style="display:flex"><i style="width:'+wc+'%;background:var(--warn);border-radius:6px 0 0 6px"></i><i class="'+bcls+'" style="width:'+wm+'%;border-radius:0 6px 6px 0"></i></div></div>';
};

const MOV_VISIBLE = 10;
function fitMovList(){
  const box = $("movRes"); if(!box) return;
  const rows = Array.prototype.filter.call(box.children, x => x.classList.contains("row"));
  if(rows.length <= MOV_VISIBLE){ box.style.maxHeight = "none"; box.style.overflowY = "visible"; return; }

async function gastoSheet(g){
  const cats=CART.catG.slice();if(g&&g.categoria&&!cats.some(c=>norm(c)===norm(g.categoria)))cats.push(g.categoria);
  const v=await mSheet(g?"Editar gasto":"Añadir gasto",
    F("gFecha","Fecha","date",g?String(g.fecha).slice(0,10):todayStr())+SEL("gCat","Categoría",cats,g?g.categoria:cats[0])+
    F("gDesc","Nombre o detalle (ej. Colonia)","text",g?g.descripcion:"")+F("gMonto","Monto","number",g?num(g.monto):"")+
    SEL("gBol","¿De dónde sale el dinero?",BOLSAS,g?bolsaOfG(g.id):"barberia"),"Guardar",m=>{
      const monto=num(q(m,"#gMonto").value),fecha=q(m,"#gFecha").value;
      if(!fecha||monto<=0)return "Escribe una fecha y un monto mayor que 0.";
      return {fecha,categoria:q(m,"#gCat").value,descripcion:q(m,"#gDesc").value.trim(),monto,bolsa:q(m,"#gBol").value};});
  if(!v)return;
  const rowv={fecha:v.fecha,categoria:v.categoria,descripcion:v.descripcion,monto:v.monto};let id=g&&g.id;
  if(g){const r=await sb.from("gastos").update(rowv).eq("id",g.id);if(r.error){alert("No se pudo guardar: "+r.error.message);return;}}
  else{const r=await sb.from("gastos").insert(rowv).select("id");if(r.error){alert("No se pudo guardar: "+r.error.message);return;}id=r.data&&r.data[0]&&r.data[0].id;}
  if(id!=null){if(v.bolsa==="barberia")delete CART.bolsaG[id];else CART.bolsaG[id]=v.bolsa;await guardarCart();}
  else if(v.bolsa!=="barberia")alert("El gasto se guardó, pero no pude fijar de qué bolsa sale. Edítalo y vuelve a elegirla.");
  // Si es un producto del inventario, preguntar cuántas unidades sumar
  if (!g) {
    const nombreGasto = (v.descripcion || "").trim();
    const lista = window.inventario || [];
    const nGasto = norm(nombreGasto);

    // 1) coincidencia exacta  2) el nombre del producto está dentro del texto del gasto
    let prod = lista.find(x => norm(x.nombre) === nGasto);
    if (!prod && nGasto) {
      prod = lista.find(x => nGasto.indexOf(norm(x.nombre)) >= 0 || norm(x.nombre).indexOf(nGasto) >= 0);
    }

    if (prod) {
      const cantidad = await mSheet(
        "Sumar al inventario",
        '<p class="lead">«' + esc(prod.nombre) + '» está en tu inventario (stock actual: ' + prod.stock_actual + ').</p>' +
        '<div class="field"><label>¿Cuántas unidades compraste?</label>' +
        '<input id="invQty" type="number" inputmode="decimal" value="1" min="1"></div>',
        "Sumar al stock",
        m => {
          const n = Number(q(m, "#invQty").value) || 0;
          if (n <= 0) return "Pon un número mayor que 0.";
          return { n };
        }
      );
      if (cantidad && cantidad.n) {
        await window.cambiarStock(Number(prod.id), cantidad.n);
      }
    } else if (nombreGasto && lista.length) {
      toast("Gasto guardado. No encontré «" + nombreGasto + "» en el inventario (el nombre debe parecerse al del producto).", 5000);
    }
  }

  toast(g ? "Gasto actualizado" : "Gasto guardado");
  await loadData();
}
async function borrarGasto(id){
  if(!(await ask("Borrar gasto","¿Seguro que quieres borrar este gasto?","Borrar")))return;
  const old=allG().find(x=>x.id===id), bol=CART.bolsaG[id];
  const r=await sb.from("gastos").delete().eq("id",id);if(r.error){alert("No se pudo borrar: "+r.error.message);return;}
  if(CART.bolsaG[id]){delete CART.bolsaG[id];await guardarCart();}
  toast("Gasto borrado");await loadData();
  if(old)setUndo("Gasto borrado",async()=>{
    const {id:_i,...rest}=old;
    const x=await sb.from("gastos").insert(rest).select("id");
    if(x.error){alert("No se pudo deshacer: "+x.error.message);return false;}
    const nid=x.data&&x.data[0]&&x.data[0].id;
    if(nid!=null&&bol&&bol!=="barberia"){CART.bolsaG[nid]=bol;await guardarCart();}
  });
}

      const monto=num(q(m,"#iMonto").value),fecha=q(m,"#iFecha").value;

async function ingresoDel(id){
  if(!(await ask("Borrar ingreso","¿Seguro que quieres borrar este ingreso?","Borrar")))return;
  const old=CART.ingresos.find(x=>x.id===id);

/* ---------- Cobros de clientes (editar / borrar) ---------- */
async function cobroEdit(key){
  const r=reservas.find(x=>x.key===key);if(!r)return;
  const snap=JSON.parse(JSON.stringify(r.rows));
  const v=await mSheet("Editar cobro de "+esc(r.nombre),F("cPrecio","Dinero cobrado","number",r.charged)+F("cProp","Propina","number",r.tip||""),"Guardar",m=>{
    const p=num(q(m,"#cPrecio").value);if(p<0)return "El monto no puede ser negativo.";return {p,t:num(q(m,"#cProp").value)};});
  if(!v)return;const ids=r.rows.map(x=>x.id);
  let ok=await updRows([ids[0]],{precio_cobrado:v.p,propina:v.t});
  if(ok&&ids.length>1)ok=await updRows(ids.slice(1),{precio_cobrado:0,propina:0});
  if(ok){toast("Cobro actualizado");await loadData();setUndo("Cobro editado",()=>restoreTurnos(snap));}
}
async function cobroDel(key){
  const r=reservas.find(x=>x.key===key);if(!r)return;
  const snap=JSON.parse(JSON.stringify(r.rows));
  if(!(await ask("Borrar cobro","Se quita el cobro de "+r.nombre+" ("+money(r.charged+r.tip)+"). El cliente vuelve a la lista de «por cobrar». Si en realidad no vino, después márcalo como no-show o cancélalo.","Borrar cobro")))return;
  const ok=await updRows(r.rows.map(x=>x.id),{precio_cobrado:null,propina:0});
  if(ok){toast("Cobro borrado");await loadData();setUndo("Cobro borrado",()=>restoreTurnos(snap));}
}
/* ---------- Categorías ---------- */
async function catAction(a,kd,i){
  const arr=kd==="g"?CART.catG:CART.catI,old=arr[i];
  const nombre=(titulo,val)=>mSheet(titulo,F("cn","Nombre","text",val||""),"Guardar",m=>{
    const n=q(m,"#cn").value.trim();if(!n)return "Escribe un nombre.";
    if(arr.some((c,j)=>j!==i&&norm(c)===norm(n)))return "Ya existe esa categoría.";return {n:n};});
  if(a==="add"){const v=await nombre("Nueva categoría","");if(!v)return;arr.push(v.n);}
  else if(a==="edit"){
    const v=await nombre("Editar categoría",old);if(!v||v.n===old)return;arr[i]=v.n;
    if(kd==="g"){const r=await sb.from("gastos").update({categoria:v.n}).eq("categoria",old);if(r.error)alert("Se cambió la lista, pero no los gastos viejos: "+r.error.message);}
    else CART.ingresos.forEach(x=>{if(x.cat===old)x.cat=v.n;});
  }else if(a==="del"){
    if(!(await ask("Borrar categoría","Se quita «"+old+"» de la lista. Los movimientos que ya la usan no se borran.","Borrar")))return;
    arr.splice(i,1);
  }else if(a==="up"){
    if(i<=0)return;
    const t=arr[i-1]; arr[i-1]=arr[i]; arr[i]=t;
  }else if(a==="down"){
    if(i>=arr.length-1)return;
    const t=arr[i+1]; arr[i+1]=arr[i]; arr[i]=t;
  }
  await guardarCart();if(kd==="g")await loadData();else window.renderAll();
}

    outG=gastos.filter(g=>{const b=CART.bolsaG[g.id];return b&&b!=="barberia";});

  }
  _ra();
  try{renderCartera();injectHoy();fixGastosPg();}

/* ---------- Botones de Carteras ---------- */
document.addEventListener("click",e=>{
  const t=e.target; let b;
  b=t.closest("[data-cart]");
  if(b){
    const a=b.dataset.cart;
    if(a==="gasto")gastoSheet();
    else if(a==="ingreso")ingresoSheet();
    else if(a==="go"){const n=document.querySelector('nav.bottom button[data-n="cartera"]');if(n)n.click();}
    return;
  }
  b=t.closest("[data-fil]");
  if(b){FIL=b.dataset.fil;renderCartera();return;}
  b=t.closest("[data-mv]");
  if(b){
    const tp=b.dataset.t,k=b.dataset.k,ed=b.dataset.mv==="edit";
    if(tp==="cobro")ed?cobroEdit(k):cobroDel(k);
    else if(tp==="ingreso"){const i=CART.ingresos.find(x=>x.id===k);if(i)ed?ingresoSheet(i):ingresoDel(k);}
    else if(tp==="gasto"){const g=allG().find(x=>String(x.id)===k);if(g)ed?gastoSheet(g):borrarGasto(g.id);}
    return;
  }
  b=t.closest("[data-cat]");
  if(b){catAction(b.dataset.cat,b.dataset.kd,+b.dataset.i);return;}
});
document.addEventListener("change",e=>{
  if(e.target.classList&&e.target.classList.contains("cmes")&&e.target.value){MES=e.target.value;renderCartera();}
});  
if(typeof appShown!=="undefined"&&appShown)window.loadData();
})();

<script>

const oldNav=document.querySelector("nav.bottom"),nav=oldNav.cloneNode(false);oldNav.replaceWith(nav);
nav.innerHTML=Object.keys(NAV).map(k=>'<button data-n="'+k+'"><span>'+NAV[k].icon+'</span>'+NAV[k].label+(NAV[k].items?" ▾":"")+'</button>').join("");
["navPop","navShade"].forEach(i=>{const o=$(i);if(o)o.remove();});
const shade=document.createElement("div");shade.id="navShade";shade.className="hidden";
const pop=document.createElement("div");pop.id="navPop";pop.className="hidden";
$("app").appendChild(shade);$("app").appendChild(pop);
let cur="resumen";
const groupOf=p=>Object.keys(NAV).find(k=>NAV[k].page===p||(NAV[k].items&&NAV[k].items.some(i=>i[0]===p)));
function closePop(){pop.classList.add("hidden");shade.classList.add("hidden");}
function show(p){
  cur = p;
  closePop();

  // Ocultar todas las secciones
  Array.prototype.forEach.call(main.children, s => {
    if (s.tagName === "SECTION") s.classList.add("hidden");
  });

  // Mostrar la sección correspondiente
  const pagesToShow = (p === "ajustes") ? ["ajustes", "precios", "wa", "mensajes"] : [p];
  pagesToShow.forEach(i => {
    const s = $("pg-" + i);
    if (s) s.classList.remove("hidden");
  });

  // Ocultar o mostrar el selector de períodos
  $("periods").classList.toggle("hidden", PER.indexOf(p) < 0);

  // Marcar el botón activo
  const g = groupOf(p);
  nav.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.n === g));

  window.scrollTo(0, 0);

  // === AQUÍ ESTÁ LA CLAVE: pintar el contenido ===
  if (p === "inventario" && typeof renderInventarioPg === "function") {
    renderInventarioPg();
  }
  if (p === "cartera" && typeof renderCartera === "function") {
    renderCartera();
  }
  if (p === "clientes") {
    requestAnimationFrame(() => {
      const x = $("cliQ");
      if (x) x.dispatchEvent(new Event("input", { bubbles: true }));
    });
  }
}
nav.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const k=b.dataset.n,G=NAV[k];
  if(!G.items){show(G.page);return;}
  if(!pop.classList.contains("hidden")&&pop.dataset.g===k){closePop();return;}
  pop.dataset.g=k;
  pop.innerHTML=G.items.map(i=>'<button data-go="'+i[0]+'"'+(i[0]===cur?' class="on"':'')+'>'+i[1]+'</button>').join("");
  const r=b.getBoundingClientRect(),w=Math.min(230,window.innerWidth-16);
  pop.style.width=w+"px";pop.style.left=Math.max(8,Math.min(window.innerWidth-w-8,r.left+r.width/2-w/2))+"px";
  pop.classList.remove("hidden");shade.classList.remove("hidden");
});
pop.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.go==="deshacer"){closePop();window.__undo();return;}  
if(b.dataset.go==="salir"){closePop();sb.auth.signOut().then(()=>location.reload());return;}show(b.dataset.go);});
shade.addEventListener("click",closePop);

/* Limpieza de pantallas después de cada render */
function fraseHoy(){
  const t=todayStr(), d=dayFin(t), f=monthFin(t.slice(0,7));
  let a = d.ing>0
    ? '<b>Hoy entraron '+money(d.ing)+'.</b><br>Sepáralos así: <span style="color:var(--bad)">🔴 '+money(d.reserve)+' Barbería</span> · <span style="color:var(--save)">🔵 '+money(d.ahorro)+' Ahorro</span> · <span style="color:var(--ok)">🟢 '+money(d.libre)+' Para ti</span>.'
    : '<b>Hoy todavía no ha entrado dinero.</b>';
  const falta=Math.max(0,BARBER_BUDGET-f.reserve);
  a += '<br>'+(falta>0.5
    ? 'Este mes llevas '+money(f.reserve)+' apartados para la barbería y te faltan '+money(falta)+'.'
    : 'La barbería de este mes ya está cubierta ✔.');
  return '<div class="block" style="margin:0 0 12px;line-height:1.6">'+a+'</div>';
}
  function tidy(){
  const hoy=$("pg-hoy"),res=$("pg-resumen");
  if(hoy&&res){
    const lead=res.querySelector(":scope > .lead"),grid=res.querySelector(":scope > .grid");
    const rep=Array.prototype.find.call(hoy.querySelectorAll(":scope > .block"),b=>{const t=b.querySelector(".blockTitle");return t&&t.textContent.indexOf("Reparto de hoy")===0;});
    const cierre=hoy.querySelector("[data-cierre]"),cNote=cierre?cierre.nextElementSibling:null;
    if(lead)lead.insertAdjacentHTML("afterend",fraseHoy());
    if(rep&&grid)grid.after(rep);
    if(cierre){res.appendChild(cierre);if(cNote&&cNote.classList.contains("note"))res.appendChild(cNote);}
    hoy.innerHTML="";
    res.querySelectorAll('button.act[data-a="noshow"]').forEach(b=>b.remove());
    res.querySelectorAll(".row").forEach(row=>{
      const b=row.querySelector("button.act[data-a][data-k]"),acts=row.querySelector(".acts");
      if(!b||!acts||acts.querySelector("[data-fi]"))return;
      const r=reservas.find(x=>x.key===b.dataset.k);if(!r)return;
      acts.insertAdjacentHTML("beforeend",'<button class="act" data-fi="'+esc(r.client)+'">Ficha</button>');
    });
  }
  const c=$("pg-cartera");
  if(c){const h=c.querySelector("h1");if(h)h.textContent="Carteras";const a=c.querySelector(":scope > .acts");if(a)a.remove();}
  const aj=$("pg-ajustes"),sv=aj&&aj.querySelector('[data-aj="save"]'),l=aj&&aj.querySelector(".lead");
  const wab=aj&&Array.prototype.find.call(aj.querySelectorAll(":scope > .block"),b=>{const t=b.querySelector(".blockTitle");return t&&t.textContent.indexOf("Mi WhatsApp")===0;});
if(wab){const w=$("pg-wa");w.innerHTML="";w.appendChild(wab);}
  if(sv&&l&&l.nextElementSibling!==sv){sv.style.margin="0 0 12px";l.after(sv);}
}
const _ra=window.renderAll;
window.renderAll=function(){_ra.apply(this,arguments);try{tidy();}catch(e){console.error(e);}};
show("resumen");
})();

<script>
(function(){
  const st=document.createElement("style");
  st.textContent=".sheet{overscroll-behavior:contain;transition:transform .18s ease}.sheet.drag{transition:none}.modal{overscroll-behavior:contain}"+
    ".sheetGrab{position:sticky;top:0;z-index:5;margin:-22px -18px 8px;height:46px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;background:var(--sheet);border-radius:20px 20px 0 0}"+
    ".sheetGrab i{display:block;width:48px;height:5px;border-radius:3px;background:var(--muted);opacity:.75}";
  document.head.appendChild(st);

  function wire(m){
    const sh=m.querySelector(".sheet"); if(!sh||sh.querySelector(".sheetGrab")) return;
    const g=document.createElement("div"); g.className="sheetGrab"; g.innerHTML="<i></i>";
    sh.insertBefore(g,sh.firstChild);
    let y0=null,dy=0;
    g.addEventListener("pointerdown",e=>{y0=e.clientY;dy=0;try{g.setPointerCapture(e.pointerId);}catch(x){} sh.classList.add("drag");});
    g.addEventListener("pointermove",e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform="translateY("+dy+"px)";});
    const end=()=>{
      if(y0===null)return; y0=null; sh.classList.remove("drag");
      if(dy>90){
        sh.style.transform="translateY(100%)";
        setTimeout(()=>{const no=m.querySelector(".xno"); if(no) no.click(); else m.classList.add("hidden"); sh.style.transform="";},180);
      }else sh.style.transform="";
    };
    g.addEventListener("pointerup",end); g.addEventListener("pointercancel",end);
  }
  document.querySelectorAll(".modal").forEach(wire);
  new MutationObserver(ms=>ms.forEach(r=>r.addedNodes.forEach(n=>{
    if(n.nodeType===1&&n.classList.contains("modal")) wire(n);
  }))).observe(document.body,{childList:true});
})();
</script>
