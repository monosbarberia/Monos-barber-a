<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mono's Barbería | Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<style>
/* PALETA (igual que la web de reservas):
   fondo verde bosque, dorado para títulos/bordes/botones.
   VERDE = ingresos · AZUL = ahorro · ROJO = egresos · ÁMBAR = pendientes/avisos */
:root{
  --forest:#1c3823;      /* texto sobre botones dorados */
  --night:#1c3823;       /* fondo general (como reservas) */
  --deep:#142a1a;        /* tarjetas */
  --sheet:#23472c;       /* ventanas emergentes */
  --input:#122416;       /* campos de texto */
  --gold:#d4bc74;
  --gold-soft:#efdc9f;
  --cream:#f7f2e0;
  --muted:#d2d6c3;
  --line:rgba(203,178,106,.32);
  --ok:#62e08c;          /* ingresos */
  --save:#6db8ff;        /* ahorro */
  --bad:#ff8174;         /* egresos */
  --warn:#f5c96e;        /* pendientes */
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--night);color:var(--cream);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.hidden{display:none!important}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#2c5535 0%,var(--night) 65%)}
.loginBox{width:100%;max-width:380px}
.loginBrand{font-family:var(--serif);font-weight:700;font-size:46px;color:var(--gold);line-height:1;margin:0 0 4px}
.loginSub{color:var(--muted);margin:0 0 28px;font-size:16px}
.field{margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}
.field input,.field select{width:100%;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:13px 14px;outline:none;font-size:16px}
.btn{width:100%;border:0;border-radius:10px;padding:14px;background:var(--gold);color:var(--forest);font-weight:700;font-size:16px}
.btn:disabled{opacity:.55}
.btnGhost{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px;background:transparent;color:var(--gold);font-weight:600;margin-top:10px;font-size:15px}
.msg{margin-top:14px;padding:12px;border-radius:10px;font-size:14px}
.msg.err{background:rgba(255,129,116,.14);border:1px solid rgba(255,129,116,.45);color:#ffd2cc}
#app{min-height:100dvh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:20;background:rgba(28,56,35,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topRow{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:0 auto}
.brand{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--gold)}
.topBtns{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--gold);border-radius:9px;padding:7px 11px;font-size:14px}
.periods{display:flex;gap:6px;max-width:760px;margin:10px auto 0;overflow-x:auto}
.period{white-space:nowrap;border:1px solid var(--line);background:var(--deep);border-radius:9px;padding:7px 14px;font-size:14px}
.period.on{background:var(--gold);color:var(--forest);border-color:var(--gold);font-weight:700}
main{max-width:760px;margin:0 auto;padding:18px 16px 30px}
h1{font-family:var(--serif);font-weight:700;font-size:32px;color:var(--gold);margin:4px 0 2px;line-height:1.1}
.lead{color:var(--muted);margin:0 0 18px;font-size:15px}
.note{color:var(--muted);font-size:13px;margin:6px 0 0}
.hero{padding:6px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.hero .big{font-family:var(--serif);font-weight:700;font-size:58px;line-height:1;color:var(--ok)}
.hero .cap{color:var(--muted);font-size:14px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .value{font-family:var(--serif);font-weight:700;font-size:29px;line-height:1.05;color:var(--cream)}
.card.gold .value{color:var(--gold-soft)}
.card.ok .value{color:var(--ok)}
.card.save .value{color:var(--save)}
.card.bad .value{color:var(--bad)}
.card.warn .value{color:var(--warn)}
.card .label{color:var(--muted);font-size:13.5px;margin-bottom:6px}
.card .sub{color:var(--muted);font-size:13px;margin-top:5px}
.block{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:12px}
.blockTitle{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--gold);margin-bottom:4px}
.blockHelp{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.chartBox{height:220px;position:relative}
.row{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1)}.row:last-child{border-bottom:0}
.rowTop{display:flex;justify-content:space-between;gap:12px}
.rowTitle{font-weight:600;font-size:15px}.rowSub{color:var(--muted);font-size:13px;margin-top:2px}
.rowVal{font-weight:700;white-space:nowrap;color:var(--gold-soft);text-align:right;font-size:15px}
.rowVal.bad{color:var(--bad)}.rowVal.warn{color:var(--warn)}.rowVal.ok{color:var(--ok)}.rowVal.save{color:var(--save)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.bar{height:8px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar>i.r{background:var(--bad)}
.bar>i.b{background:var(--save)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.act{border:1px solid var(--line);background:transparent;color:var(--gold);border-radius:8px;padding:6px 10px;font-size:13px}
.act.good{background:var(--gold);color:var(--forest);border-color:var(--gold);font-weight:700}
.act.red{color:var(--bad);border-color:rgba(255,129,116,.5)}
.del{border:0;background:transparent;color:var(--bad);font-size:20px;padding:0 4px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(20,42,26,.98);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav.bottom button{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;padding:6px 2px}
nav.bottom button.on{color:var(--gold);font-weight:700}nav.bottom span{display:block;font-size:19px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;background:var(--sheet);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet h2{font-family:var(--serif);font-size:26px;color:var(--gold);margin:0 0 16px}
.sheet .field input,.sheet .field select{background:var(--input)}
.spin{width:28px;height:28px;border:3px solid rgba(203,178,106,.25);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.info{width:20px;height:20px;border-radius:50%;border:1px solid var(--muted);background:transparent;color:var(--muted);font-size:12px;line-height:1;padding:0;flex-shrink:0;margin-left:6px}
.help{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);color:#e8ebdb;font-size:13.5px;line-height:1.55}
.card .label{display:flex;align-items:center}
.blockHead{display:flex;align-items:center;margin-bottom:4px}.blockHead .blockTitle{margin-bottom:0}
.sep{height:1px;background:var(--line);margin:8px 0}
.subTitle{color:var(--gold);font-size:14px;font-weight:700;margin:10px 0 2px}
.loginLogo{display:block;width:300px;max-width:85%;height:auto;margin:0 auto 12px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.loginSub{text-align:center}
.brandLogo{display:block;height:38px;width:auto}
</style>
</head>
<body>
<section id="login"><div class="loginBox">
  <img src="logo.png" alt="Mono's" class="loginLogo"><p class="loginSub">Estadisticas de la Barbería</p>
  <div class="field"><label for="email">Correo</label><input id="email" type="email" autocomplete="username"></div>
  <div class="field"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"></div>
  <button id="loginBtn" class="btn">Entrar</button><div id="loginMsg"></div>
</div></section>

<section id="app" class="hidden">
  <header class="top">
    <div class="topRow"><img src="logo.png" alt="Mono's" class="brandLogo">
      <div class="topBtns"><button class="chip" id="refreshBtn">Actualizar</button><button class="chip" id="logoutBtn">Salir</button></div></div>
    <div class="periods" id="periods">
      <button class="period on" data-p="today">Hoy</button><button class="period" data-p="week">Esta semana</button>

    </div>

  <main>

  </main>

  </nav>
</section>

<div id="expenseModal" class="modal hidden"><div class="sheet">
  <h2>Añadir gasto</h2>
  <div class="field"><label for="exDate">Fecha</label><input id="exDate" type="date"></div>
  <div class="field"><label for="exCat">Categoría</label><select id="exCat">
    <option value="productos">Productos</option><option value="mantenimiento de máquinas">Mantenimiento de máquinas</option>
    <option value="navajas">Navajas</option><option value="otros">Otros (renta, luz… no entran en "compras")</option></select></div>
  <div class="field"><label for="exDesc">Nombre del producto (siempre igual: Colonia, Cuchillas, Talco…)</label><input id="exDesc" type="text" placeholder="Ej. Colonia"></div>
  <div class="field"><label for="exAmount">Monto</label><input id="exAmount" type="number" inputmode="decimal"></div>
  <button class="btn" id="saveExpense">Guardar gasto</button>
  <button class="btnGhost" data-close="expenseModal">Cancelar</button><div id="exMsg"></div>
</div></div>

<div id="goalModal" class="modal hidden"><div class="sheet">
  <h2>Meta del mes</h2>
  <div class="field"><label for="gMonth">Mes</label><input id="gMonth" type="month"></div>
  <div class="field"><label for="gRev">Meta de dinero cobrado</label><input id="gRev" type="number" inputmode="decimal"></div>
  <div class="field"><label for="gProfit">Meta de ganancia neta</label><input id="gProfit" type="number" inputmode="decimal"></div>
  <button class="btn" id="saveGoal">Guardar meta</button>
  <button class="btnGhost" data-close="goalModal">Cancelar</button><div id="gMsg"></div>
</div></div>

<script>
/* =========================================================
   ⚙️ CONFIGURACIÓN — LO ÚNICO QUE TIENES QUE CAMBIAR
   START_DATE: el panel cuenta SOLO desde este día.
   Cuando empieces a trabajar, cambia la fecha (AAAA-MM-DD)
   y sube el archivo a GitHub. Nada más.
========================================================= */
const START_DATE = "2026-10-08";   // <-- CAMBIA ESTA FECHA

const BARBER_BUDGET = 12000;  // gastos fijos de la barbería por mes
const SAVE_PCT = 10;          // % de ahorro sobre lo que queda después de la barbería

const SB_URL = "https://ldxxflhwpyzldisydhmd.supabase.co";
const SB_KEY = "sb_publishable_zYVUWmP8r6s21WegS23RxQ_G-MOf1TH";
const SLOTS = ["9:00 AM","9:30 AM","10:00 AM","10:30 AM","11:00 AM","11:30 AM","2:00 PM","2:30 PM","3:00 PM","3:30 PM","4:00 PM"];
const DAYS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const ISO = /^\d{4}-\d{2}-\d{2}$/;

let sb = null, turnos = [], gastos = [], metas = [], reservas = [], bloqueos = [];
let period = "today", appShown = false, lastLoad = 0;
const charts = {};

/* ---------- SEGURIDAD: la sesión NO se guarda. Al recargar o cerrar la página, hay que entrar de nuevo ---------- */
try{
  [localStorage, sessionStorage].forEach(st => Object.keys(st).filter(k => k.indexOf("sb-")===0 || k.indexOf("supabase")>=0).forEach(k => st.removeItem(k)));
}catch(e){}
try{ sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false, autoRefreshToken:true, detectSessionInUrl:false}}); }
catch(e){ document.getElementById("loginMsg").innerHTML = '<div class="msg err">No se pudo cargar Supabase. Recarga la página.</div>'; }
// Si el navegador restaura la página desde memoria (botón atrás), forzar recarga limpia
window.addEventListener("pageshow", e => { if(e.persisted) location.reload(); });
if(window.Chart){ Chart.defaults.color = "#d2d6c3"; Chart.defaults.font.size = 13; }

/* ---------- Utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
function num(v){ if(v===null||v===undefined||v==="") return 0; const n = Number(String(v).replace(",",".")); return Number.isFinite(n)?n:0; }
function money(v){ const n = Math.round(num(v)); return (n<0?"-$":"$") + Math.abs(n).toLocaleString("en-US"); }
const pct = v => (Number.isFinite(v)?v:0).toFixed(0) + "%";
const norm = s => String(s ?? "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const digits = s => String(s ?? "").replace(/\D/g,"");
const fmt = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function parseD(s){ const p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
const todayStr = () => fmt(new Date());
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function niceDate(s){ if(!ISO.test(s)) return s; const p = s.split("-"); return p[2]+"-"+p[1]+"-"+p[0]; }
const shortDate = s => { const p = s.split("-"); return p[2]+"/"+p[1]; };
const daysBetween = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
function slotMin(t){
  const m = String(t||"").trim().toUpperCase().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)$/);
  if(!m) return null; let h = Number(m[1])%12; if(m[3]==="PM") h+=12; return h*60+Number(m[2]);
}
function slotPassed(fecha, turno){
  const t = todayStr(); if(fecha<t) return true; if(fecha>t) return false;
  const m = slotMin(turno); if(m===null) return false;
  const n = new Date(); return m <= n.getHours()*60+n.getMinutes();
}
function eachDay(start, end, fn){ const d = parseD(start), e = parseD(end); while(d<=e){ fn(fmt(d), d.getDay()); d.setDate(d.getDate()+1); } }
function workdaysBetween(a, b){ let n = 0; if(a>b) return 0; eachDay(a, b, (d, wd) => { if(wd!==0) n++; }); return n; }
// Lunes de la semana (lunes–sábado; un domingo suelto cae en la semana anterior)
function weekStart(s){ const d = parseD(s), w = d.getDay(); d.setDate(d.getDate() - (w===0?6:w-1)); return fmt(d); }
function monthBounds(month){ const y = +month.slice(0,4), m = +month.slice(5,7); return {first:fmt(new Date(y,m-1,1)), last:fmt(new Date(y,m,0))}; }

function getPeriod(){
  const t = todayStr();
  if(period==="today") return {start:t,end:t,label:"hoy"};
  if(period==="week") return {start:weekStart(t),end:t,label:"esta semana"};
  if(period==="month"){ const d = parseD(t); return {start:fmt(new Date(d.getFullYear(),d.getMonth(),1)),end:t,label:"este mes"}; }
  return {start:START_DATE,end:t,label:"desde el "+niceDate(START_DATE)};
}
// Período COMPLETO (incluye días que aún no llegan): para poder cobrar clientes que vienen antes de su turno
function periodFull(){
  const t = todayStr();
  if(period==="today") return {start:t,end:t};
  if(period==="week"){ const s = weekStart(t); return {start:s,end:addDays(s,6)}; }
  if(period==="month"){ const b = monthBounds(t.slice(0,7)); return {start:b.first,end:b.last}; }
  return {start:START_DATE,end:"2999-12-31"};
}
function inPeriod(r){ const p = getPeriod(); return r.fecha>=p.start && r.fecha<=p.end; }

/* ---------- Reservas (varias filas con igual reserva_id = 1 reserva) ---------- */
function splitServices(text){
  const out = [], seen = new Set();
  String(text||"").replace(/[{}]/g,"").split(",").forEach(x => { const l = x.trim(), k = norm(l); if(k && !seen.has(k)){ seen.add(k); out.push(l); } });
  return out;
}
const hasCharge = row => row.precio_cobrado !== null && row.precio_cobrado !== undefined;

function buildReservas(){
  const map = new Map(); bloqueos = [];
  turnos.forEach(row => {
    if(!row.fecha || !ISO.test(row.fecha) || row.fecha < START_DATE) return;
    if(row.estado && row.estado !== "ocupado") return;
    if(row.cancelado === true) return;
    const phone = digits(row.telefono);
    const financial = hasCharge(row) || row.no_show === true || num(row.total) > 0 || !!row.servicios;
    if(!phone && !financial){ bloqueos.push(row); return; }
    const key = row.reserva_id ? "r:"+row.reserva_id : "i:"+row.id;
    if(!map.has(key)) map.set(key, {key, rows:[], fecha:row.fecha, nombre:row.nombre||"Sin nombre", telefono:row.telefono||"",
      client: phone ? "p:"+phone : "n:"+norm(row.nombre), services:[], total:0, expected:0, charged:0, tip:0,
      charge:false, noShow:false, noShowPaid:false});
    const r = map.get(key);
    r.rows.push(row);
    r.total = Math.max(r.total, num(row.total));
    r.expected += num(row.precio_esperado);
    r.charged += num(row.precio_cobrado);
    r.tip += num(row.propina);
    if(hasCharge(row)) r.charge = true;
    if(row.no_show === true) r.noShow = true;
    if(row.no_show_cobrado === true) r.noShowPaid = true;
    splitServices(row.servicios).forEach(s => { if(!r.services.some(x => norm(x)===norm(s))) r.services.push(s); });
  });
  reservas = [...map.values()];
  reservas.forEach(r => {
    r.rows.sort((a,b) => (slotMin(a.turno)??0) - (slotMin(b.turno)??0));
    r.turno = r.rows[0].turno;
    r.passed = slotPassed(r.fecha, r.turno);
    // cobrada = realmente atendida. Pasada y sin cobro = pendiente (NO cuenta como servicio)
    if(r.noShow) r.status = "noshow";
    else if(r.charge) r.status = "cobrada";
    else if(r.passed) r.status = "pendiente";
    else r.status = "futura";
  });
}

function resumen(list){
  const cobradas = list.filter(r => r.status==="cobrada");
  const pend = list.filter(r => r.status==="pendiente");
  const noshows = list.filter(r => r.status==="noshow");
  let revenue = 0, tips = 0, expected = 0, disc = 0, extra = 0;
  cobradas.forEach(r => {
    revenue += r.charged; tips += r.tip;
    if(r.expected > 0){ expected += r.expected; const d = r.charged - r.expected; if(d<0) disc += -d; else extra += d; }
    else expected += r.charged;
  });
  const svc = {}; let svcTotal = 0;
  cobradas.forEach(r => r.services.forEach(s => {   // SOLO cobradas
    const k = norm(s); if(!svc[k]) svc[k] = {label:s,n:0}; svc[k].n++; svcTotal++;
  }));
  let pendAmount = 0, pendUnknown = 0;
  pend.forEach(r => { const a = r.total || r.expected || 0; if(a>0) pendAmount += a; else pendUnknown++; });
  return {cobradas, pend, noshows, revenue, tips, expected, disc, extra, svc, svcTotal, pendAmount, pendUnknown,
          ticket: cobradas.length ? revenue/cobradas.length : 0};
}
const gastosPeriodo = () => { const p = getPeriod(); return gastos.filter(g => String(g.fecha)>=p.start && String(g.fecha)<=p.end); };
const sumGastos = l => l.reduce((s,g) => s + num(g.monto), 0);

function buildClients(){
  const p = getPeriod(), map = new Map();
  reservas.forEach(r => {
    let c = map.get(r.client);
    if(!c){ c = {key:r.client,nombre:r.nombre,telefono:r.telefono,visits:0,revenue:0,first:null,last:null,noshows:0,future:false,pVisits:0,pRevenue:0}; map.set(r.client,c); }
    if(r.nombre && r.nombre!=="Sin nombre") c.nombre = r.nombre;
    if(r.telefono) c.telefono = r.telefono;
    if(r.status==="noshow") c.noshows++;
    if(r.status==="futura") c.future = true;
    if(r.status==="cobrada"){   // solo cobradas son visitas
      c.visits++; c.revenue += r.charged;
      if(!c.first || r.fecha<c.first) c.first = r.fecha;
      if(!c.last || r.fecha>c.last) c.last = r.fecha;
      if(r.fecha>=p.start && r.fecha<=p.end){ c.pVisits++; c.pRevenue += r.charged; }
    }
  });
  return [...map.values()];
}

/* ---------- Finanzas: reparto automático de cada ingreso ----------
   Cada peso que entra se divide al instante en 3:
   1) Fondo de la barbería (gastos fijos + insumos)  2) Ahorro (SAVE_PCT del resto)  3) Para ti
   El % del fondo = BARBER_BUDGET / ingreso esperado del mes (meta si la hay, si no tu ritmo actual). */
function monthFin(month){
  const rs = reservas.filter(r => r.status==="cobrada" && r.fecha.slice(0,7)===month);
  const ing = rs.reduce((s,r) => s + r.charged + r.tip, 0);
  const gReg = sumGastos(gastos.filter(x => String(x.fecha).slice(0,7)===month));
  const mb = monthBounds(month), t = todayStr();
  const startEff = mb.first < START_DATE ? START_DATE : mb.first;
  const g = metas.find(m => String(m.mes).slice(0,7)===month);
  let expected = g ? num(g.objetivo_ingresos) : 0, source = "meta";
  if(!(expected > 0)){
    let upto;
    if(month === t.slice(0,7)) upto = rs.some(r => r.fecha===t) ? t : addDays(t,-1);
    else upto = mb.last;
    const elapsed = Math.max(1, workdaysBetween(startEff, upto));
    const total = Math.max(1, workdaysBetween(startEff, mb.last));
    expected = ing / elapsed * total; source = "ritmo";
  }
  expected = Math.max(expected, BARBER_BUDGET*1.5);          // nunca reserva más de ~2/3 de cada cobro
  const rate = Math.min(0.67, BARBER_BUDGET / expected);
  const reserve = Math.min(BARBER_BUDGET, ing * rate);       // reservado para la barbería este mes
  const resto = ing - reserve;
  const ahorro = resto * SAVE_PCT / 100;
  const deficit = Math.max(0, gReg - reserve);               // gastos que pasaron lo reservado (salen de tu retiro)
  const libre = Math.max(0, resto - ahorro - deficit);
  return {ing, gReg, rate, expected, source, reserve, resto, ahorro, deficit, libre, fondo: reserve - gReg};
}
function dayFin(day){
  const f = monthFin(day.slice(0,7));
  const ing = reservas.filter(r => r.status==="cobrada" && r.fecha===day).reduce((s,r) => s + r.charged + r.tip, 0);
  const reserve = ing * f.rate, resto = ing - reserve, ahorro = resto * SAVE_PCT / 100;
  return {ing, reserve, ahorro, libre: resto - ahorro, rate: f.rate};
}
// Fondo acumulado de la barbería (lo reservado menos lo gastado, de todos los meses)
function fundTotal(){
  let y = +START_DATE.slice(0,4), m = +START_DATE.slice(5,7), sum = 0;
  const cur = todayStr().slice(0,7);
  for(let i=0;i<120;i++){
    const k = y+"-"+String(m).padStart(2,"0");
    sum += monthFin(k).fondo;
    if(k >= cur) break;
    m++; if(m>12){ m = 1; y++; }
  }
  return sum;
}

/* ---------- Compras inteligentes ----------
   Aprende de TUS gastos: agrupa por nombre del producto, calcula cada cuántos días lo compras
   (promedio de tus últimas compras reales), y combina eso con el fondo y el ritmo de la semana. */
function weekPace(){
  const t = todayStr(), cur = weekStart(t), closed = {}; let curRev = 0;
  reservas.filter(r => r.status==="cobrada").forEach(r => {
    const k = weekStart(r.fecha), v = r.charged + r.tip;
    if(k===cur) curRev += v; else if(k<cur) closed[k] = (closed[k]||0) + v;
  });
  const ks = Object.keys(closed).sort().slice(-4);
  const base = ks.length ? ks.reduce((s,k) => s + closed[k], 0) / ks.length : null;
  const elapsed = Math.max(1, workdaysBetween(cur, t));
  const proj = curRev / elapsed * 6;
  const good = (base===null || elapsed<2) ? null : proj >= base*0.9;   // null = todavía no se sabe
  return {base, proj, curRev, good};
}
function purchaseAdvice(){
  const t = todayStr(), wp = weekPace(), groups = {};
  gastos.forEach(g => {
    if(norm(g.categoria)==="otros" || num(g.monto)<=0 || String(g.fecha)<START_DATE) return;
    const name = String(g.descripcion||"").trim() || String(g.categoria||"Producto"), k = norm(name);
    if(!groups[k]) groups[k] = {name, buys:[]};
    groups[k].buys.push({fecha:String(g.fecha), monto:num(g.monto)});
  });
  let fondo = fundTotal();
  const items = Object.values(groups).map(gr => {
    gr.buys.sort((a,b) => a.fecha.localeCompare(b.fecha));
    const last = gr.buys[gr.buys.length-1], recent = gr.buys.slice(-3);
    const cost = recent.reduce((s,b) => s + b.monto, 0) / recent.length;
    const gaps = []; for(let i=1;i<gr.buys.length;i++){ const d = daysBetween(gr.buys[i-1].fecha, gr.buys[i].fecha); if(d>0) gaps.push(d); }
    const cycle = gaps.length ? Math.round(gaps.slice(-3).reduce((s,x) => s + x, 0) / Math.min(3,gaps.length)) : null;
    return {name:gr.name, last, cost, cycle, left: cycle===null ? null : cycle - daysBetween(last.fecha, t)};
  });
  items.sort((a,b) => (a.left===null?9999:a.left) - (b.left===null?9999:b.left));
  return items.map(it => {
    const a = {name:it.name, level:"ok", short:"", detail:""};
    if(it.cycle===null){
      a.level = "learn"; a.short = "Aprendiendo";
      a.detail = "Solo hay 1 compra anotada ("+money(it.cost)+" el "+niceDate(it.last.fecha)+"). Con la próxima calculo cada cuánto se te acaba.";
      return a;
    }
    const lead = Math.max(3, Math.round(it.cycle*0.2)), early = lead + 7, left = it.left, can = fondo >= it.cost;
    const info = "Lo compras cada ~"+it.cycle+" días · "+money(it.cost)+". ";
    if(left > early){
      a.short = "Aún no toca"; a.detail = info + "Te dura unos "+left+" días (≈ "+shortDate(addDays(t,left))+").";
    }else if(left <= lead){
      if(can){
        a.level = "buy"; a.short = left<=0 ? "Compra ya" : "Buen momento";
        a.detail = info + (left<=0 ? "Ya te tocaba. " : "Te quedan ~"+left+" días. ") + "El fondo de la barbería lo cubre: cómpralo de ahí, no de tu retiro.";
        fondo -= it.cost;
      }else if(left <= 0){
        a.level = "urgent"; a.short = "Falta fondo";
        a.detail = info + "Ya te tocaba y el fondo tiene "+money(Math.max(0,fondo))+" de "+money(it.cost)+". Cómpralo con los próximos ingresos del día.";
      }else{
        a.level = "wait"; a.short = "Espera";
        a.detail = info + "Te quedan ~"+left+" días y el fondo aún no alcanza (faltan "+money(it.cost-Math.max(0,fondo))+"). Se va llenando con cada cobro.";
      }
    }else{ // ventana de adelanto: hay margen para elegir una buena semana
      if(wp.good===true && can){
        a.level = "buy"; a.short = "Adelanta";
        a.detail = info + "Esta semana va bien y el fondo alcanza. Comprarlo ahora evita que te agarre una semana floja (te quedan ~"+left+" días).";
        fondo -= it.cost;
      }else if(wp.good===false){
        a.level = "wait"; a.short = "Espera";
        a.detail = info + "Esta semana va floja y aún te dura ~"+left+" días: mejor espera una semana mejor.";
      }else{
        a.short = "Ya viene"; a.detail = info + "Te quedan ~"+left+" días. Te aviso cuando sea buen momento.";
      }
    }
    return a;
  });
}

async function updRows(ids, vals){
  const {error} = await sb.from("turnos").update(vals).in("id", ids);
  if(error){ alert("No se pudo guardar: " + error.message + "\n\nSi dice 'permission' o 'policy', falta dar permiso a tu usuario en Supabase (ver SQL)."); return false; }
  return true;
}
async function act(a, key){
  const r = reservas.find(x => x.key === key); if(!r) return;
  const ids = r.rows.map(x => x.id), first = [ids[0]], rest = ids.slice(1);
  let ok = false;
  if(a === "cobrar"){
    const m = prompt("¿Cuánto cobraste a " + r.nombre + "?", r.total || r.expected || ""); if(m === null) return;
    const amount = num(m); if(amount < 0) return;
    const t = prompt("Propina (0 si no hubo)", "0"); if(t === null) return;
    ok = await updRows(first, {precio_cobrado:amount, precio_esperado:r.total || amount, propina:num(t)});
    if(ok && rest.length) ok = await updRows(rest, {precio_cobrado:0, propina:0});
  }else if(a === "propina"){
    const t = prompt("Propina de " + r.nombre + " (reemplaza la anterior)", r.tip || ""); if(t === null) return;
    ok = await updRows(first, {propina:num(t)});
    if(ok && rest.length) ok = await updRows(rest, {propina:0});
  }else if(a === "noshow"){
    if(!confirm("¿Marcar a " + r.nombre + " como no-show?")) return;
    ok = await updRows(ids, {no_show:true});
  }else if(a === "cancelar"){
    if(!confirm("¿Cancelar la reserva de " + r.nombre + "? (no vino y no cuenta como no-show)")) return;
    ok = await updRows(ids, {cancelado:true});
  }else if(a === "nspaid"){
    ok = await updRows(ids, {no_show_cobrado:true, cobro_no_show:r.total || r.expected || 0});
  }else if(a === "quitarns"){
    if(!confirm("¿Quitar la marca de no-show?")) return;
    ok = await updRows(ids, {no_show:false, no_show_cobrado:false});
  }
  if(ok) await loadData();
}

function occupancy(list, p){
  let avail = 0;
  eachDay(p.start, p.end, (d, wd) => { if(wd===0) return; avail += SLOTS.filter(t => slotPassed(d,t)).length; });
  const blocked = bloqueos.filter(b => b.fecha>=p.start && b.fecha<=p.end && slotPassed(b.fecha,b.turno)).length;
  avail = Math.max(0, avail - blocked);
  let used = 0;
  list.forEach(r => { if(r.status==="cobrada") r.rows.forEach(x => { if(slotPassed(x.fecha,x.turno)) used++; }); });
  return {avail, used, pct: avail ? Math.min(100, used/avail*100) : 0};
}

function goalHtml(){

function weeksData(){
  const w = {};
  reservas.filter(r => r.status==="cobrada").forEach(r => {
    const k = weekStart(r.fecha); if(!w[k]) w[k] = {k, rev:0, n:0};
    w[k].rev += r.charged + r.tip; w[k].n++;
  });
  return Object.values(w).sort((a,b) => a.k.localeCompare(b.k)).map(x => Object.assign(x, {ticket:x.n ? x.rev/x.n : 0}));
}
function weeksBlock(){

  const best = base.reduce((a,b) => b.rev>a.rev?b:a), worst = base.reduce((a,b) => b.rev<a.rev?b:a);
  const max = Math.max.apply(null, ws.map(x => x.rev)) || 1;
  const body = ws.slice().reverse().slice(0,8).map(x => {
    const end = new Date(parseD(x.k)); end.setDate(end.getDate()+5);
    const tag = x.k===cur ? " · en curso" : (base.length>1 && x.k===best.k ? " · 🏆 mejor" : (base.length>1 && x.k===worst.k ? " · más floja" : ""));
    return '<div class="row"><div class="rowTop"><div><div class="rowTitle">'+shortDate(x.k)+' al '+shortDate(fmt(end))+esc(tag)+'</div><div class="rowSub">'+x.n+' clientes · ticket '+money(x.ticket)+'</div></div><div class="rowVal ok">'+money(x.rev)+'</div></div><div class="bar"><i style="width:'+(x.rev/max*100)+'%"></i></div></div>';
  }).join("");
  return block("Mejor y peor semana", body, "Lunes a sábado, con propinas. Las semanas terminadas se comparan entre sí.");
}
function savingsBlock(){
  const t = todayStr(), f = monthFin(t.slice(0,7)), d = dayFin(t), fondo = fundTotal();
  const r = f.rate*100, ah = (100-r)*SAVE_PCT/100, tuyo = 100-r-ah;
  let body = '<div class="note" style="margin:0 0 6px"><b>Por cada $100 que entran: <span style="color:var(--bad)">$'+r.toFixed(0)+' a la barbería</span>, <span style="color:var(--save)">$'+ah.toFixed(0)+' a ahorro</span> y <span style="color:var(--ok)">$'+tuyo.toFixed(0)+' son para ti</span>.</b></div>';
  body += '<div class="subTitle">De lo que entró hoy</div>' +
    row("Entró hoy","cobrado + propinas",money(d.ing),"ok") +
    row("Para la barbería","gastos e insumos",money(d.reserve),"bad") +
    row("Ahorro ("+SAVE_PCT+"% del resto)","no lo toques",money(d.ahorro),"save") +
    row("Para ti hoy","puedes retirarlo",money(d.libre),"ok");
  body += '<div class="sep"></div><div class="subTitle">Acumulado del mes</div>' +
    row("Ingresos del mes","cobrado + propinas",money(f.ing),"ok") +
    row("Reservado para la barbería","tope mensual "+money(BARBER_BUDGET),money(f.reserve),"bad") +
    row("Gastado (registrado)","lo que anotaste en Gastos",money(f.gReg),"bad") +
    row("Fondo de la barbería","reservado − gastado, acumulado",money(fondo),"bad") +
    row("Ahorro del mes",SAVE_PCT+"% de lo que queda",money(f.ahorro),"save") +
    row("Disponible para retirar este mes","ya descontado barbería y ahorro",money(f.libre),"ok");
  if(f.deficit>0) body += '<div class="note" style="margin-top:8px;color:var(--bad)">Gastaste '+money(f.deficit)+' más de lo reservado este mes; ya se descontó de tu retiro.</div>';
  body += '<div class="note" style="margin-top:8px">El % para la barbería se ajusta solo según '+(f.source==="meta"?"tu meta del mes ("+money(f.expected)+")":"tu ritmo actual (proyección ≈ "+money(f.expected)+" al mes)")+'. Registra la renta y demás gastos fijos en Gastos para que el fondo sea real.</div>';
  return block("Ahorro y retiro", body,

}
function productsBlock(){
  const adv = purchaseAdvice();
  const body = adv.length ? adv.map(a => row(esc(a.name), esc(a.detail), esc(a.short), LEVEL_CLS[a.level])).join("")
    : empty("Cuando anotes compras de productos (colonia, cuchillas, talco…) aprendo cada cuánto los compras y te aviso cuándo conviene.");

    card("Precio normal", money(s.expected), "Servicios cobrados", "ok") + card("Descuentos", money(s.disc), "Cobrado de menos", "bad") +

    card("Dinero cobrado", money(s.revenue), "Lo que entró por servicios", "ok") + card("Gastos", money(g), gl.length+" registro(s)", "bad") +
    card("Ganancia neta", money(profit), "Margen: "+pct(total>0 ? profit/total*100 : 0), "ok") + '</div>';

/* ---------- CLIENTES ---------- */
function renderClientes(){
  const p = getPeriod(), clients = buildClients(), t = todayStr();
  const active = clients.filter(c => c.pVisits>0);
  const nuevos = clients.filter(c => c.first && c.first>=p.start && c.first<=p.end);
  const recurrentes = active.filter(c => c.visits>=2);
  const perdidos = clients.filter(c => c.last && !c.future && daysBetween(c.last,t)>=30).sort((a,b) => a.last.localeCompare(b.last));
  let h = '<h1>Clientes</h1><p class="lead">Quiénes vienen, quiénes vuelven y quiénes se fueron.</p>';
  h += '<div class="grid">'+card("Clientes del período",active.length,"Vinieron "+esc(p.label))+card("Nuevos",nuevos.length,"Primera visita en el período")+
    card("Recurrentes",recurrentes.length,"2 visitas o más")+card("Desaparecidos",perdidos.length,"30 días o más sin venir")+'</div>';
  const top = active.slice().sort((a,b) => b.pRevenue-a.pRevenue || b.pVisits-a.pVisits).slice(0,10);
  h += block("Quién te deja más dinero", top.length ? top.map((c,i) => row((i+1)+". "+esc(c.nombre), c.pVisits+" visita(s) · "+c.visits+" en total", money(c.pRevenue), "ok")).join("") : empty("Todavía no hay clientes."));
  h += block("Clientes desaparecidos", perdidos.length ? perdidos.slice(0,20).map(c => row(esc(c.nombre),
    "Última visita: "+niceDate(c.last)+" · "+c.visits+" visita(s)"+(c.telefono?" · "+esc(c.telefono):""), daysBetween(c.last,t)+" días","warn")).join("")
    : empty("Nadie lleva 30 días sin venir."), "Escríbeles: recuperar un cliente cuesta menos que conseguir uno nuevo.");
  $("pg-clientes").innerHTML = h;
}

/* ---------- AGENDA ---------- */
function renderAgenda(){
  const p = getPeriod(), list = reservas.filter(inPeriod), s = resumen(list), occ = occupancy(list,p);
  const lostSlots = s.noshows.reduce((n,r) => n + r.rows.length, 0);
  const hist = reservas.filter(r => r.status==="cobrada");
  const wdRev = [0,0,0,0,0,0,0], wdN = [0,0,0,0,0,0,0];
  hist.forEach(r => { const d = parseD(r.fecha).getDay(); wdRev[d] += r.charged; wdN[d]++; });
  const order = [1,2,3,4,5,6], bestDay = order.slice().sort((a,b) => wdRev[b]-wdRev[a] || wdN[b]-wdN[a])[0];
  const hasHist = hist.length>0, hourN = {}; SLOTS.forEach(t => hourN[t] = 0);
  hist.forEach(r => r.rows.forEach(x => { if(hourN[x.turno]!==undefined) hourN[x.turno]++; }));
  const bestHour = SLOTS.slice().sort((a,b) => hourN[b]-hourN[a])[0];
  const svc = Object.values(s.svc).sort((a,b) => b.n-a.n);
  let h = '<h1>Agenda</h1><p class="lead">Cuándo se llena la barbería y qué se pide más.</p>';
  h += '<div class="grid">'+card("Ocupación",pct(occ.pct),occ.used+" de "+occ.avail+" turnos")+card("Turnos perdidos",lostSlots,"Por no-shows")+
    card("Mejor día",hasHist && wdN[bestDay]>0 ? DAYS[bestDay] : "—","Según el historial")+
    card("Hora más pedida",hasHist && hourN[bestHour]>0 ? esc(bestHour) : "—","Según el historial")+'</div>';
  h += block("Servicios realizados ("+esc(p.label)+")", svc.length ? canvas("chSvc") : empty("Todavía no hay servicios cobrados."), "Solo servicios de clientes cobrados.");
  h += block("Dinero por día de la semana", hasHist ? canvas("chWd") : empty("Todavía no hay datos."));
  h += block("Horas más ocupadas", hasHist ? canvas("chHr") : empty("Todavía no hay datos."));
  $("pg-agenda").innerHTML = h;
  if(svc.length) drawChart("chSvc","bar",svc.map(x => x.label),svc.map(x => x.n),{horizontal:true});
  if(hasHist){
    drawChart("chWd","bar",order.map(d => DAYS[d].slice(0,3)),order.map(d => wdRev[d]),{money:true, color:C_OK});
    drawChart("chHr","bar",SLOTS.map(t => t.replace(":00","").replace(" ","")),SLOTS.map(t => hourN[t]), {color:C_OK});
  }
}

    card("Te deben",money(owedAmount),owed.length+" sin cobrar"+(owedUnknown?" · "+owedUnknown+" sin monto":""),owed.length?"bad":"")+

/* ---------- Datos ---------- */
async function fetchAll(table){
  const size = 1000; let from = 0, all = [];
  while(true){
    let q = sb.from(table).select("*");
    if(table==="turnos") q = q.gte("fecha", START_DATE).lte("fecha","2999-12-31");
    q = q.order("id",{ascending:true}).range(from, from+size-1);
    const {data, error} = await q; if(error) throw error;
    all = all.concat(data||[]); if(!data || data.length<size) break; from += size;
  }
  return all;
}
async function loadData(){
  $("globalMsg").innerHTML = "";
  try{
    const res = await Promise.all([fetchAll("turnos"), fetchAll("gastos"), fetchAll("metas")]);
    turnos = res[0]; gastos = res[1].filter(g => String(g.fecha) >= START_DATE); metas = res[2]; lastLoad = Date.now();
    if(!turnos.length) $("globalMsg").innerHTML = '<div class="msg err">No hay turnos desde '+niceDate(START_DATE)+'. Si debería haber, revisa que tu usuario esté en la tabla admins.</div>';
    renderAll();
  }catch(e){ console.error(e); $("globalMsg").innerHTML = '<div class="msg err"><b>No se pudieron cargar los datos.</b><br>'+esc(e.message||e)+'</div>'; }
}

/* ---------- Gastos y metas ---------- */
const openModal = id => $(id).classList.remove("hidden");
const closeModal = id => $(id).classList.add("hidden");
function openExpense(){ $("exDate").value = todayStr(); $("exDesc").value = ""; $("exAmount").value = ""; $("exMsg").innerHTML = ""; openModal("expenseModal"); }
async function saveExpense(){
  const fecha = $("exDate").value, monto = num($("exAmount").value);
  if(!fecha || monto<=0){ $("exMsg").innerHTML = '<div class="msg err">Escribe una fecha y un monto mayor que 0.</div>'; return; }
  $("saveExpense").disabled = true;
  const {error} = await sb.from("gastos").insert({fecha, categoria:$("exCat").value, descripcion:$("exDesc").value.trim(), monto});
  $("saveExpense").disabled = false;
  if(error){ $("exMsg").innerHTML = '<div class="msg err">'+esc(error.message)+'</div>'; return; }
  closeModal("expenseModal"); await loadData();
}
async function delExpense(id){
  if(!confirm("¿Borrar este gasto?")) return;
  const {error} = await sb.from("gastos").delete().eq("id", id);
  if(error){ alert("No se pudo borrar: "+error.message); return; }
  await loadData();
}
function openGoal(){
  const m = todayStr().slice(0,7); $("gMonth").value = m; $("gRev").value = ""; $("gProfit").value = ""; $("gMsg").innerHTML = "";
  const g = metas.find(x => String(x.mes).slice(0,7)===m);
  if(g){ $("gRev").value = num(g.objetivo_ingresos)||""; $("gProfit").value = num(g.objetivo_ganancia)||""; }
  openModal("goalModal");
}
async function saveGoal(){
  const month = $("gMonth").value;
  if(!month){ $("gMsg").innerHTML = '<div class="msg err">Elige el mes.</div>'; return; }
  const mes = month+"-01", vals = {objetivo_ingresos:num($("gRev").value), objetivo_ganancia:num($("gProfit").value)};
  $("saveGoal").disabled = true; let error;
  const found = metas.find(m => String(m.mes).slice(0,10)===mes);
  if(found) ({error} = await sb.from("metas").update(vals).eq("id", found.id));
  else ({error} = await sb.from("metas").insert(Object.assign({mes}, vals)));
  $("saveGoal").disabled = false;
  if(error){ $("gMsg").innerHTML = '<div class="msg err">'+esc(error.message)+'</div>'; return; }
  closeModal("goalModal"); await loadData();
}

/* ---------- Entrada / salida ---------- */
async function login(){

/* =====================================================================
   🧠 EL CEREBRO: aprende de tus cobros, gastos y clientes.
   No guarda nada aparte: cada vez que cobras algo nuevo, recalcula todo
   con TODO tu historial (lo reciente pesa más que lo viejo).
   ===================================================================== */
function learn(){
  const t = todayStr(), month = mon(t), C = cobr(), byDay = {};
  C.forEach(r => { byDay[r.fecha] = (byDay[r.fecha] || 0) + ingOf(r); });
  const wd = {}; for(let d = 1; d <= 6; d++) wd[d] = {s:0, w:0, n:0, avg:null};
  let allS = 0, allN = 0;
  Object.keys(byDay).forEach(f => {
    if(f >= t) return; const d = parseD(f).getDay(); if(d === 0) return;
    const w = Math.pow(0.85, Math.floor(daysBetween(f, t)/7));      // cada semana atrás pesa 15% menos
    wd[d].s += byDay[f]*w; wd[d].w += w; wd[d].n++; allS += byDay[f]; allN++;
  });
  for(let d = 1; d <= 6; d++) wd[d].avg = wd[d].w ? wd[d].s/wd[d].w : null;
  const dayAvg = allN ? allS/allN : null;
  const wdAvg = d => (wd[d] && wd[d].avg !== null) ? wd[d].avg : (dayAvg || 0);
  const prodAll = gastos.filter(g => isProdGasto(g) && String(g.fecha) >= START_DATE);
  return {t, month, C, byDay, wd, dayAvg, wdAvg, todayIng:byDay[t] || 0,
    monthIng:C.filter(r => mon(r.fecha) === month).reduce((s,r) => s + ingOf(r), 0),
    ticketAll:C.length ? C.reduce((s,r) => s + r.charged, 0)/C.length : 0,
    costVar:C.length ? prodAll.reduce((s,g) => s + num(g.monto), 0)/C.length : 0,
    prodAll, daysData:allN + (byDay[t] ? 1 : 0)};
}
function goals(m){
  const g = metas.find(x => String(x.mes).slice(0,7) === m.month), meta = g ? num(g.objetivo_ingresos) : 0;
  const b = monthBounds(m.month), s0 = b.first < START_DATE ? START_DATE : b.first;
  const wdays = Math.max(1, workdaysBetween(s0, b.last)), todayWd = parseD(m.t).getDay();
  let daily = null, src = "";
  if(meta > 0){ daily = meta/wdays; src = "meta"; }
  else if(todayWd !== 0 && m.wd[todayWd].n >= 2 && m.wd[todayWd].avg > 0){ daily = m.wd[todayWd].avg; src = "habito"; }
  const gMonth = sumGastos(gastos.filter(x => mon(String(x.fecha)) === m.month));
  return {meta, daily, src, eq:Math.max(BARBER_BUDGET, gMonth), gMonth, b, todayWd};
}
function projection(m, G){
  const last = +G.b.last.slice(8,10), booked = {};
  reservas.forEach(r => { if(r.status === "futura" && mon(r.fecha) === m.month) booked[r.fecha] = (booked[r.fecha] || 0) + (r.total || r.expected || 0); });
  const todayProj = G.todayWd === 0 ? m.todayIng : Math.max(m.todayIng + (booked[m.t] || 0), m.wdAvg(G.todayWd));
  const remain = Math.max(0, todayProj - m.todayIng), tomorrow = addDays(m.t, 1);
  const labels = [], act = [], pro = []; let cum = 0, eqDay = null;
  for(let i = 1; i <= last; i++){
    const f = m.month+"-"+String(i).padStart(2,"0"), w = parseD(f).getDay(); labels.push(String(i));
    if(f <= m.t){
      cum += (m.byDay[f] || 0); act.push(Math.round(cum)); pro.push(f === m.t ? Math.round(cum) : null);
      if(eqDay === null && cum >= G.eq) eqDay = i;
    }else{
      act.push(null);
      cum += (f === tomorrow ? remain : 0) + Math.max(w === 0 ? 0 : m.wdAvg(w), booked[f] || 0);
      pro.push(Math.round(cum));
      if(eqDay === null && cum >= G.eq) eqDay = i;
    }
  }
  if(m.t === G.b.last) cum += remain;
  return {labels, act, pro, end:cum, eqDay};
}
function costModel(m){
  const cur = weekStart(m.t), cl = {}, sp = {};
  m.C.forEach(r => { const k = weekStart(r.fecha); cl[k] = (cl[k] || 0) + 1; });
  m.prodAll.forEach(g => { const k = weekStart(String(g.fecha).slice(0,10)); sp[k] = (sp[k] || 0) + num(g.monto); });
  const ks = Object.keys(cl).filter(k => k < cur).sort();
  const pts = ks.map((k,i) => { const w = ks.slice(Math.max(0, i-3), i+1); const c = w.reduce((s,x) => s + cl[x], 0), s = w.reduce((a,x) => a + (sp[x] || 0), 0); return {k, v:c ? s/c : 0}; });
  let alert = null;
  if(pts.length >= 4){
    const prev = pts.slice(0,-1), avg = prev.reduce((s,p) => s + p.v, 0)/prev.length, last = pts[pts.length-1].v;
    if(avg > 0 && last > avg*(1 + ALZA_COSTO_PCT/100)) alert = {avg, last, pct:(last/avg - 1)*100};
  }
  return {pts, alert};
}
function comboModel(m){
  const map = {};
  m.C.forEach(r => {
    if(!r.services.length) return;
    const arr = r.services.slice().sort((a,b) => norm(a) < norm(b) ? -1 : 1), k = arr.map(norm).join("+");
    const o = map[k] || (map[k] = {label:arr.join(" + "), n:0, rev:0, hours:0});
    o.n++; o.rev += r.charged; o.hours += r.rows.length*0.5;
  });
  const list = Object.values(map).map(o => Object.assign(o, {perHour:o.hours ? o.rev/o.hours : 0, avg:o.n ? o.rev/o.n : 0}));
  return {list, ranked:list.filter(o => o.n >= 2).sort((a,b) => b.perHour - a.perHour), byRev:list.slice().sort((a,b) => b.rev - a.rev)};
}
function slotModel(m){
  const t = m.t, from0 = addDays(t,-56), from = from0 < START_DATE ? START_DATE : from0, y = addDays(t,-1);
  const used = new Set(), blk = new Set(), worked = new Set(m.C.map(r => r.fecha)), occ = {}, tot = {};
  m.C.forEach(r => r.rows.forEach(x => used.add(x.fecha+"|"+x.turno)));
  bloqueos.forEach(b => blk.add(b.fecha+"|"+b.turno));
  if(from <= y) eachDay(from, y, (d, wd) => {
    if(wd === 0 || !worked.has(d)) return;           // solo cuento días en que trabajaste
    SLOTS.forEach(s => { const k = d+"|"+s; if(blk.has(k)) return; const g = wd+"|"+s; tot[g] = (tot[g] || 0) + 1; if(used.has(k)) occ[g] = (occ[g] || 0) + 1; });
  });
  const list = Object.keys(tot).filter(g => tot[g] >= 3).map(g => { const p = g.split("|"); return {wd:+p[0], slot:p[1], tot:tot[g], occ:occ[g] || 0, rate:(occ[g] || 0)/tot[g]}; })
    .sort((a,b) => a.rate - b.rate || b.tot - a.tot);
  return {list, ready:m.C.length >= MIN_COBRADAS_HORARIOS};
}
function cycleModel(m){
  const by = {}, fut = new Set();
  reservas.forEach(r => { if(r.status === "futura") fut.add(r.client); });
  m.C.forEach(r => {
    const c = by[r.client] || (by[r.client] = {key:r.client, nombre:r.nombre, telefono:r.telefono, dates:[]});
    if(r.nombre && r.nombre !== "Sin nombre") c.nombre = r.nombre; if(r.telefono) c.telefono = r.telefono;
    if(c.dates.indexOf(r.fecha) < 0) c.dates.push(r.fecha);
  });
  const risk = []; let known = 0;
  Object.values(by).forEach(c => {
    c.dates.sort(); const last = c.dates[c.dates.length-1], since = daysBetween(last, m.t), gaps = [];
    for(let i = 1; i < c.dates.length; i++){ const d = daysBetween(c.dates[i-1], c.dates[i]); if(d > 0) gaps.push(d); }
    const isKnown = gaps.length >= 1, cycle = isKnown ? Math.max(7, Math.round(median(gaps.slice(-4)))) : DIAS_SIN_RITMO;
    if(isKnown) known++;
    const ratio = since/cycle;
    if(!fut.has(c.key) && ratio >= (isKnown ? UMBRAL_RIESGO : 1))
      risk.push({nombre:c.nombre, telefono:c.telefono, visits:c.dates.length, since, cycle, known:isKnown, ratio});
  });
  risk.sort((a,b) => b.visits - a.visits || a.since - b.since);
  return {risk, known};
}
function fondoInfo(){
  const t = todayStr(), fondo = fundTotal();
  const inn = ap.filter(g => !isDevol(g)).reduce((s,g) => s + num(g.monto), 0), out = ap.filter(isDevol).reduce((s,g) => s + num(g.monto), 0);
  const debt = Math.max(0, inn - out); let tone = "ok", txt;
  if(fondo < 0){ tone = "bad"; txt = "El fondo está en negativo ("+money(fondo)+"): gastaste más de lo reservado y lo estás sacando de tu retiro."; }
  else if(fondo < BARBER_BUDGET*0.2){ tone = "warn"; txt = "El fondo está bajo ("+money(fondo)+"). Cuidado con compras grandes por ahora."; }
  else txt = "El fondo está sano ("+money(fondo)+"): la barbería se sostiene sola.";
  return {fondo, inn, out, debt, tone, txt, canReturn:Math.max(0, Math.min(debt, fondo))};
}
function ctx(){
  const m = learn(), G = goals(m);
  return {m, G, P:projection(m, G), K:costModel(m), CB:comboModel(m), SL:slotModel(m), CY:cycleModel(m), F:fondoInfo()};
}

  else{
    const low = SL.list.filter(o => o.rate <= 0.4).slice(0,4);
    hf = low.length ? low.map(o => row(DAYS[o.wd]+" · "+esc(o.slot), "Ocupada "+o.occ+" de "+o.tot+" veces (últimas 8 semanas)", pct(o.rate*100), "warn")).join("") +
      '<div class="note">Idea: una promo solo para estas horas llena lo que hoy no te deja nada.</div>' : empty("No hay horas flojas claras. ¡Buen trabajo!");
  }
  h += block("Horas y días flojos", hf, "Mira tus últimas 8 semanas de días trabajados y muestra los horarios que casi siempre están vacíos.");

  // Dinero personal
  let dp = row("Estado del fondo", esc(F.txt), "", F.tone);
  dp += row("Dinero tuyo metido en la barbería", "Total que has puesto de tu bolsillo", money(F.inn), F.inn > 0 ? "warn" : "") +
    row("Ya devuelto", "Lo que te has devuelto del fondo", money(F.out), "ok") +
    row("Por devolverte", F.canReturn > 0 ? "El fondo ya permite devolverte hasta "+money(F.canReturn) : "Cuando el fondo tenga de sobra, te aviso", money(F.debt), F.debt > 0 ? "warn" : "");
  dp += '<button class="btnGhost" onclick="aporteDinero(\'in\')">Puse dinero mío en la barbería</button><button class="btnGhost" onclick="aporteDinero(\'out\')">Me devolví dinero del fondo</button>';
  const mov = ap.slice().sort((a,c) => String(c.fecha).localeCompare(String(a.fecha))).slice(0,6);
  if(mov.length) dp += '<div class="sep"></div>' + mov.map(g => row(isDevol(g) ? "Devolución" : "Aporte", niceDate(String(g.fecha))+" · "+esc(String(g.descripcion).replace(/^[^:]*:\s*/, "")), money(g.monto)+' <button class="del" onclick="delAporte('+Number(g.id)+')" aria-label="Borrar">×</button>', isDevol(g) ? "ok" : "warn")).join("");
  h += block("Tu dinero personal y la barbería", dp, "Anota aquí cada vez que pongas dinero tuyo para algo de la barbería, y cuando te lo devuelvas del fondo. Estos movimientos no cuentan como gasto ni cambian tus ganancias; solo te muestran cuánto te debe la barbería.");

  // Confianza
  const nCompras = purchaseAdvice().length;
  h += block("Qué tan seguro estoy",
    row("Días con cobros", "Para saber tu ritmo de cada día de la semana", conf(m.daysData), "") +
    row("Clientes con ritmo conocido", m.C.length ? CY.known+" cliente(s) con 2 o más visitas" : "Todavía ninguno", conf(CY.known), "") +
    row("Combos de servicios", CB.list.length+" distintos", conf(CB.list.length), "") +
    row("Productos que sigo", nCompras+" producto(s)", conf(nCompras), "") +
    '<div class="note">Cada vez que cobras algo nuevo todo se recalcula solo. Lo reciente pesa más que lo viejo.</div>',
    "'Poca' significa que aún son pocos datos: tómalo como una idea. 'Alta' significa que ya hay base para confiar.");

  $("pg-plan").innerHTML = h;
  after.forEach(f => f());
}

/* ---------- Simulador (aparte, no toca tus datos reales) ---------- */
const SIM = {N:null, T:null, C:null, X:50, L:10, touched:{}};
function simDefaults(m){
  const from = addDays(m.t,-28), last = m.C.filter(r => r.fecha > from), s0 = from < START_DATE ? START_DATE : from;
  const wdays = Math.max(1, workdaysBetween(s0, m.t));
  return {N:last.length ? Math.round(last.length/wdays*26) : null, T:last.length ? Math.round(last.reduce((s,r) => s + r.charged, 0)/last.length) : null, C:Math.round(m.costVar)};
}
const simField = (k, label, val) => '<div class="field"><label>'+label+'</label><input type="number" inputmode="decimal" data-k="'+k+'" value="'+(val === null || val === undefined ? "" : val)+'"></div>';
function renderSim(X){
  const d = simDefaults(X.m);
  ["N","T","C"].forEach(k => { if(!SIM.touched[k]) SIM[k] = d[k]; });
  let h = '<h1>Simula</h1><p class="lead">Prueba cambiar tus precios y mira cómo te iría.</p>';
  h += '<div class="msg" style="margin:0 0 12px;background:rgba(203,178,106,.12);border:1px solid var(--line);color:var(--gold-soft)">Esto es solo una simulación: nada de lo que escribas aquí se guarda ni cambia tus cifras reales.</div>';
  h += '<div class="block">' + simField("N","Clientes que atiendes al mes",SIM.N) + simField("T","Cuánto cobras en promedio por cliente",SIM.T) + simField("C","Lo que gastas en productos por cliente",SIM.C) +
    simField("X","Cuánto subirías el precio (por cliente)",SIM.X) + simField("L","Clientes que crees que podrías perder (%)",SIM.L) +
    '<div class="note">Los 3 primeros los calculé con tus últimos 28 días. Cámbialos si quieres probar otra situación.</div></div>';
  h += '<div class="block"><div class="blockTitle">Resultado</div><div id="simOut"></div><div class="chartBox" style="margin-top:12px"><canvas id="chSim"></canvas></div>' +
    '<div class="note">La línea verde muestra cuánto ganas de más (o de menos) al mes según el % de clientes que pierdas. Donde cruza la línea roja (cero) está tu punto seguro.</div></div>';
  $("pg-sim").innerHTML = h;
  simOut();
}
function simOut(){
  const box = $("simOut"); if(!box) return;
  const N = SIM.N, T = SIM.T, c = SIM.C || 0, X = SIM.X || 0, L = (SIM.L || 0)/100;
  if(!(N > 0) || !(T > 0)){ box.innerHTML = empty("Escribe cuántos clientes atiendes al mes y cuánto cobras en promedio."); if(charts.chSim){ charts.chSim.destroy(); delete charts.chSim; } return; }
  const base = N*(T - c), prof = l => N*(1 - l)*(T + X - c), extra = l => prof(l) - base;
  const brk = (X > 0 && (T + X - c) > 0) ? X/(T + X - c)*100 : null;
  let h = row("Hoy ganas al mes", "Clientes × (lo que cobras − productos)", money(base), "ok") +
    row("Subes "+money(X)+" y no pierdes a nadie", "Lo mismo, con el precio nuevo", sgn(extra(0)), extra(0) >= 0 ? "ok" : "bad") +
    row("Subes "+money(X)+" y pierdes "+(SIM.L || 0)+"% de clientes", "Con menos clientes pero más caros", sgn(extra(L)), extra(L) >= 0 ? "ok" : "bad");
  if(brk !== null) h += row("Tu punto seguro", "Puedes perder hasta este % de clientes y ganar igual que hoy", brk.toFixed(0)+"%", "warn");
  box.innerHTML = h;
  const xs = [], ys = []; for(let l = 0; l <= 20; l += 2){ xs.push(l+"%"); ys.push(Math.round(extra(l/100))); }
  multiLine("chSim", xs, [{label:"Ganancia de más al mes", data:ys, color:C_OK, fill:true}, {label:"Igual que hoy", data:xs.map(() => 0), color:C_BAD, dash:[2,4], r:0, tension:0}], {money:true, beginZero:false});
}

/* ---------- Avisos a clientes (en la pantalla Clientes) ---------- */
function fill(tpl, c){
  const first = c.nombre === "Sin nombre" ? "amigo" : String(c.nombre).split(/\s+/)[0];
  return String(tpl).replace(/\{nombre\}/g, first).replace(/\{dias\}/g, c.since).replace(/\{ciclo\}/g, c.cycle).replace(/\{link\}/g, LINK_RESERVAS);
}
function waLink(c, txt){
  let p = digits(c.telefono); if(!p) return "";
  if(CODIGO_PAIS && p.length <= 10 && p.indexOf(CODIGO_PAIS) !== 0) p = CODIGO_PAIS + p;
  return "https://wa.me/"+p+"?text="+encodeURIComponent(txt);
}
function injectClientes(X){
  const rows = X.CY.risk.slice(0,10);
  const body = rows.length ? rows.map(c => {
    const link = waLink(c, fill(c.ratio >= 2.5 ? MENSAJE_RECUPERAR : MENSAJE_EN_RIESGO, c));
    return row(esc(c.nombre), c.known ? "Suele venir cada ~"+c.cycle+" días · van "+c.since : "Aún no sé su ritmo · van "+c.since+" días", c.since+" días", "warn",
      link ? '<a class="act good" href="'+link+'" target="_blank" rel="noopener">Escribir por WhatsApp</a>' : '<span class="note">Sin teléfono</span>');
  }).join("") : empty("Nadie ha pasado su ritmo normal por ahora.");
  const html = block("Avisos: clientes por escribirles", body,
    "Aprendo cada cuántos días viene cada cliente. Cuando pasa de su ritmo normal, aparece aquí con un botón que abre WhatsApp con el mensaje listo. Para cambiar el mensaje, busca MENSAJE_EN_RIESGO en el código.");
  const g = $("pg-clientes").querySelector(".grid"); if(g) g.insertAdjacentHTML("afterend", html);
}
function injectResumen(X){
  const hero = $("pg-resumen").querySelector(".hero"); if(hero) hero.insertAdjacentHTML("afterend", adminBlock(X));
}

/* ---------- Dinero personal: guardar y borrar ---------- */
window.aporteDinero = async function(tipo){
  const m = prompt(tipo === "in" ? "¿Cuánto dinero tuyo pusiste en la barbería?" : "¿Cuánto dinero te devolviste del fondo?", ""); if(m === null) return;
  const monto = num(m); if(monto <= 0){ alert("Escribe un monto mayor que 0."); return; }
  const n = prompt("¿Para qué fue? (opcional)", "") || "";
  const {error} = await sb.from("gastos").insert({fecha:todayStr(), categoria:"otros", descripcion:(tipo === "in" ? TAG_APORTE : TAG_DEVOL)+n.trim(), monto});
  if(error){ alert("No se pudo guardar: "+error.message); return; }
  await loadData();
};
window.delAporte = async function(id){
  if(!confirm("¿Borrar este movimiento?")) return;
  const {error} = await sb.from("gastos").delete().eq("id", id);
  if(error){ alert("No se pudo borrar: "+error.message); return; }
  await loadData();
};

/* =====================================================================
   ENGANCHE CON TU PANEL (no hace falta tocar nada de lo anterior)
   ===================================================================== */
const main = document.querySelector("main");
["plan","sim"].forEach(n => { const s = document.createElement("section"); s.id = "pg-"+n; s.className = "hidden"; main.appendChild(s); });
const nav = document.querySelector("nav.bottom");
nav.insertAdjacentHTML("beforeend", '<button data-pg="plan"><span>↗</span>Plan</button><button data-pg="sim"><span>≈</span>Simula</button>');
const st = document.createElement("style");
st.textContent = "nav.bottom button{font-size:11px}nav.bottom span{font-size:18px}a.act{display:inline-block;text-decoration:none}";
document.head.appendChild(st);
const PAGES = ["resumen","dinero","clientes","agenda","noshows","plan","sim"];
nav.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  nav.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  PAGES.forEach(n => $("pg-"+n).classList.toggle("hidden", n !== b.dataset.pg));
  $("periods").classList.toggle("hidden", b.dataset.pg === "plan" || b.dataset.pg === "sim");
  window.scrollTo(0,0);
}));
$("pg-sim").addEventListener("input", e => {
  const k = e.target.dataset ? e.target.dataset.k : null; if(!k) return;
  SIM[k] = e.target.value === "" ? null : num(e.target.value); SIM.touched[k] = true; simOut();
});

const _renderAll = window.renderAll;
window.renderAll = function(){
  if(!gastos._s){                                  // separo tus aportes personales de los gastos reales
    ap = gastos.filter(isAp);
    const clean = gastos.filter(g => !isAp(g)); clean._s = true; gastos = clean;
  }
  _renderAll();
  try{
    const X = ctx();
    injectResumen(X); injectClientes(X); renderPlan(X); renderSim(X);
  }catch(e){
    console.error(e);
    $("globalMsg").insertAdjacentHTML("beforeend", '<div class="msg err">Las funciones nuevas tuvieron un problema: '+esc(e.message || e)+'</div>');
  }
};
if(typeof appShown !== "undefined" && appShown && turnos.length) window.renderAll();   // por si los datos ya estaban cargados
})();
</script>
