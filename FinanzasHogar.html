async function all(t,q){let f=0,o=[];for(;;){let r=sb.from(t).select("*");if(q)r=q(r);const{data,error}=await r.order("id").range(f,f+999);if(error)throw error;o=o.concat(data||[]);if(!data||data.length<1000)break;f+=1000}return o}

/* ---------- Barbería: SOLO tu ganancia neta (misma regla que tu panel de la barbería) ---------- */
function build(){
 const map=new Map();
 turnos.forEach(r=>{
  if(!r.fecha||!ISO.test(r.fecha)||r.fecha<B.start)return;
  if(r.estado&&r.estado!=="ocupado")return; if(r.cancelado===true)return;
  const ph=digits(r.telefono), cobrado=r.precio_cobrado!==null&&r.precio_cobrado!==undefined;
  const fin=cobrado||r.no_show===true||num(r.total)>0||!!r.servicios; if(!ph&&!fin)return;
  const k=r.reserva_id?"r:"+r.reserva_id:"i:"+r.id;
  if(!map.has(k))map.set(k,{fecha:r.fecha,turno:r.turno,ch:0,tip:0,tot:0,exp:0,cob:false,ns:false});
  const x=map.get(k);x.ch+=num(r.precio_cobrado);x.tip+=num(r.propina);x.tot=Math.max(x.tot,num(r.total));x.exp+=num(r.precio_esperado);
  if(cobrado)x.cob=true;if(r.no_show===true)x.ns=true;
 });
 RES=[...map.values()];
 RES.forEach(r=>{r.st=r.ns?"noshow":r.cob?"cobrada":passed(r.fecha,r.turno)?"pendiente":"futura"});
}
const rd=v=>B.rd>1?Math.round(v/B.rd)*B.rd:v;
function splitDay(ing,acc){
 const capS=B.goal>0?B.goal:Infinity;
 const reserve=Math.max(0,Math.min(rd(ing*B.pb/100),ing,B.budget-acc.reserve)), resto=ing-reserve;
 const ahorro=Math.max(0,Math.min(rd(resto*B.ps/100),resto,capS-acc.ahorro));
 return{ing,reserve,ahorro,libre:ing-reserve-ahorro};
}
function netMonth(m){
 if(_fin[m])return _fin[m];
 const rs=RES.filter(r=>r.st==="cobrada"&&r.fecha.slice(0,7)===m), per={};
 rs.forEach(r=>per[r.fecha]=(per[r.fecha]||0)+r.ch+r.tip);
 // Ingresos "Repartir" de la barbería: se tratan como cobro del día (se dividen igual)
 CART_ING.forEach(i=>{
  if(i.bolsa!=="repartir")return;
  const f=String(i.fecha||"").slice(0,10);
  if(f.slice(0,7)!==m||f<B.start)return;
  per[f]=(per[f]||0)+num(i.monto);
 });
 const acc={reserve:0,ahorro:0},days={};
 Object.keys(per).sort().forEach(d=>{const x=splitDay(per[d],acc);acc.reserve+=x.reserve;acc.ahorro+=x.ahorro;days[d]=x.libre});
 const ing=sum(Object.values(per)), gReg=sum(gb.filter(x=>String(x.fecha).slice(0,7)===m).map(x=>num(x.monto)));
 const deficit=Math.max(0,gReg-acc.reserve);
 let libre=Math.max(0,ing-acc.reserve-acc.ahorro-deficit);
 // Ingresos "mio / para mí" de la barbería: van enteros a tu ganancia (sin dividir)
 CART_ING.forEach(i=>{
  if(i.bolsa!=="mio")return;
  const f=String(i.fecha||"").slice(0,10);
  if(f.slice(0,7)!==m||f<B.start)return;
  libre+=num(i.monto);
  days[f]=(days[f]||0)+num(i.monto);
 });
 return _fin[m]={libre,days};
}
/* Predicción del mes en ganancia neta (misma idea que el "Plan" de la barbería) */
function proj(m){
 const t=today(),C=RES.filter(r=>r.st==="cobrada"),by={};
 C.forEach(r=>by[r.fecha]=(by[r.fecha]||0)+r.ch+r.tip);
 CART_ING.forEach(i=>{const f=String(i.fecha||"").slice(0,10);if(f>=B.start)by[f]=(by[f]||0)+num(i.monto);});
 const wd={};for(let d=1;d<=6;d++)wd[d]={s:0,w:0};let aS=0,aN=0;
 Object.keys(by).forEach(f=>{if(f>=t)return;const d=dow(f);if(!d)return;const w=Math.pow(.85,Math.floor(diff(f,t)/7));wd[d].s+=by[f]*w;wd[d].w+=w;aS+=by[f];aN++});
 const avg=aN?aS/aN:0,wa=d=>wd[d]&&wd[d].w?wd[d].s/wd[d].w:avg;
 const sc=sum(C.map(r=>r.ch)),tick=C.length?sc/C.length:0,tr=sc>0?sum(C.map(r=>r.tip))/sc:0;
 const bk={},cn={};
 RES.forEach(r=>{if(r.fecha.slice(0,7)!==m)return;if(!(r.st==="futura"||(r.st==="pendiente"&&r.fecha===t)))return;
  const a=r.tot||r.exp||0;bk[r.fecha]=(bk[r.fecha]||0)+(a>0?a:tick)*(1+tr);cn[r.fecha]=(cn[r.fecha]||0)+1});
 const est=(f,base)=>{const w=dow(f),b=base+(bk[f]||0);if(w===0)return b;const gap=Math.max(0,wa(w)-b),ah=diff(t,f);return b+gap*(ah<=0?.1:Math.min(1,.15+.85*(ah-1)/6))};
 const dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),today_=by[t]||0,remain=Math.max(0,est(t,today_)-today_);
 const aA={reserve:0,ahorro:0},aP={reserve:0,ahorro:0};let cA=0,cP=0,ingP=0,bookedF=0,nF=0;
 const labels=[],act=[],pro=[];
 for(let i=1;i<=dim;i++){
  const f=m+"-"+String(i).padStart(2,"0");labels.push(String(i));
  const real=by[f]||0;
  if(f<=t){const x=splitDay(real,aA);aA.reserve+=x.reserve;aA.ahorro+=x.ahorro;cA+=x.libre;act.push(Math.round(cA))}else act.push(null);
  const g=f<t?real:f===t?real+remain:est(f,0);
  const y=splitDay(g,aP);aP.reserve+=y.reserve;aP.ahorro+=y.ahorro;cP+=y.libre;ingP+=g;
  pro.push(f<t?null:Math.round(cP));
  if(f>t){bookedF+=bk[f]||0;nF+=cn[f]||0}
 }
 const gReg=sum(gb.filter(x=>String(x.fecha).slice(0,7)===m).map(x=>num(x.monto)));
 const end=Math.max(0,ingP-aP.reserve-aP.ahorro-Math.max(0,gReg-aP.reserve));
 return{labels,act,pro,end,bookedF,nF};
}

/* ---------- Cálculos familiares ---------- */
function alloc(day){
 const m=day.slice(0,7),nm=m>=B.start.slice(0,7)?netMonth(m):{days:{}},dd={...nm.days};

function trGroups(list){

   if(a.tipo==="asig"){const d=num(a.monto)>0?a:b,o=d===a?b:a;from="s:"+o.categoria;to="s:"+d.categoria}
   else{const f=num(a.monto)>0?a:b,t=f===a?b:a;from="t:"+f.tj;to="t:"+t.tj}}

function dl(name,text,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function csvOf(rows){const cols=[];rows.forEach(r=>Object.keys(r).forEach(k=>{if(!cols.includes(k))cols.push(k)}));const q=v=>'"'+String(v==null?"":typeof v==="object"?JSON.stringify(v):v).replace(/"/g,'""')+'"';return"\ufeff"+cols.map(q).join(",")+"\n"+rows.map(r=>cols.map(c=>q(r[c])).join(",")).join("\n")}

 else{const c=await sb.from("family_config").select("*").eq("id",1).maybeSingle();dl("respaldo-finanzas-"+f+".json",JSON.stringify({fecha_respaldo:f,movimientos:raw,config:c.data||null},null,1),"application/json")}
 try{localStorage.setItem("fin_bk",f)}catch(e){}}
